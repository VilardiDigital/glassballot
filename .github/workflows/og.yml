name: Render link preview image
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  og:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium || sudo apt-get install -y fonts-liberation || true
      - name: Build page
        run: |
          rm -f site/og.png
          python -m pipeline.refresh --offline
          ls dist/og.html dist/assets/logo-box.png
      - name: Render image
        run: python tools/render_og.py
      - name: Rebuild site with image
        run: python -m pipeline.refresh --offline
      - name: Publish
        run: |
          git config user.name "Glass Ballot"
          git config user.email "glassballotinfo@gmail.com"
          git add site/og.png dist
          git diff --cached --quiet && exit 0
          git commit -m "New link preview image"
          git pull --rebase -X theirs || { git rebase --abort; git pull --no-rebase -X ours --no-edit; }
          git push
