name: Save state results pages
on:
  workflow_dispatch:
  push:
    paths: ["tools/probe_state.py", ".github/workflows/probe_state.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/probe_state.py
      - name: Save
        run: |
          git config user.name "Glass Ballot results"
          git config user.email "glassballotinfo@gmail.com"
          git add data/raw/fewatch
          git diff --cached --quiet && exit 0
          git commit -m "State results pages $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
