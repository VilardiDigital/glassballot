views.accessibility = () => policy("Accessibility", "We want everyone to be able to use this site, including people who use screen readers, keyboards or large text.", `
  <p>We aim to meet the Web Content Accessibility Guidelines (WCAG) 2.1, level AA. The site works with a keyboard, supports screen readers, and has a text-size button at the top of every page. It also works with your phone's or browser's own text-size settings.</p>
  <p>If something on the site is hard to use, or you need information in another format, email glassballotinfo@gmail.com and we'll help.</p>`);

views.corrections = () => { const list = (DATA.corrections || []).slice().sort((a,b) => (b.date || "").localeCompare(a.date || ""));
  return `<div class="stack-lg view">
  ${band("", "Changes and corrections", "Every time we correct a fact, and every change from our nightly records check, listed in public.", "06-city-hall-details")}
  <section class="stack"><h2 class="h2">Corrections</h2>
  ${list.length ? `<div class="list">${list.map(c => `<div class="li"><span class="body" style="gap:6px"><span class="tiny muted">${fmtDate(c.date)}${c.county && COUNTIES[c.county] ? " · " + esc(cname(c.county)) + " County" : ""}</span><span class="title">${esc(c.subject)}</span><span class="small"><span class="muted">Before:</span> ${esc(c.before)}</span><span class="small"><span class="muted">Now:</span> ${esc(c.after)}</span>${c.source ? `<a class="small" href="${esc(c.source)}" target="_blank" rel="noopener">The record we checked</a>` : ""}</span></div>`).join("")}</div>` : `<p class="notice">No corrections yet.</p>`}</section>
  <section class="stack"><h2 class="h2">Updates from the nightly check</h2>
    ${(DATA.changes || []).length ? `<div class="list">${DATA.changes.map(c => `<div class="li"><span class="body" style="gap:6px"><span class="title">${fmtDate(c.date)}</span><span class="small muted">${c.changed.length} fact${c.changed.length === 1 ? "" : "s"} changed${c.errors.length ? `. ${c.errors.length} source${c.errors.length === 1 ? "" : "s"} couldn't be reached, so we kept the last good data` : ""}.</span>${c.changed.slice(0, 12).map(x => `<span class="small"><b>${esc(x.subject)}</b>: ${esc(shownText(x.before))} <span class="muted">now</span> ${esc(shownText(x.after))}</span>`).join("")}</span></div>`).join("")}</div>` : `<p class="notice">No automatic updates yet.</p>`}
  </section>
  <section class="stack"><h2 class="h2">Where sources disagree</h2><div class="list">${ORDER.map(k => `<a href="#/${k}/problems"><span class="body"><span class="title">${esc(cname(k))} County</span><span class="tiny muted">${COUNTIES[k].problems.length} open</span></span>${chev}</a>`).join("")}</div></section>
</div>`; };

views.thanks = () => `<div class="stack-lg view"><section class="band"><h1 class="h1">Thank you. We got your report.</h1><p class="lede">A person will check it against the link you sent. If we change anything, it will be listed on our corrections page.</p><div class="row"><a class="btn primary" href="${CK ? href() : "#/"}">Back to the ballot</a></div></section></div>`;

/* ---------- share card ---------- */
function wrapText(ctx, text, maxW) { const words = text.split(" "); const lines = []; let line = ""; for (const w of words) { const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; } if (line) lines.push(line); return lines; }
async function makeShare(id) {
  const v = V[id]; const out = $("#shareOut");
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1080; const x = c.getContext("2d");
  await document.fonts.ready.catch(() => {});
  const H = '"Plus Jakarta Sans", system-ui, sans-serif', B = 'Inter, system-ui, sans-serif';
  const g = x.createLinearGradient(0,0,1080,1080); g.addColorStop(0,"#0B3D91"); g.addColorStop(1,"#1A56D0"); x.fillStyle = g; x.fillRect(0,0,1080,1080);
  x.fillStyle = "#FFFFFF"; x.font = `800 46px ${H}`; x.fillText("Glass", 72, 120); const gw = x.measureText("Glass").width; x.fillStyle = "#8DB8FF"; x.fillText("Ballot", 72 + gw + 6, 120);
  x.fillStyle = "#A9C8FF"; x.font = `600 28px ${B}`; x.fillText(`${C.county.name} Commission, ${voteDate(v)}${v.fileNumber ? ", item " + v.fileNumber : ""}`, 72, 230);
  x.fillStyle = "#FFFFFF"; x.font = `800 66px ${H}`;
  const lines = wrapText(x, v.headline, 936).slice(0,4); lines.forEach((l,i) => x.fillText(l, 72, 330 + i*78));
  let y = 330 + lines.length*78 + 44;
  x.fillStyle = "#5EEAD4"; x.font = `800 50px ${H}`; x.fillText(v.result.value || "Result not confirmed", 72, y);
  const r = rollOf(v); y += 70;
  if (r && (r.yes?.length || r.no?.length)) { x.fillStyle = "#E8F6FF"; x.font = `500 32px ${B}`;
    wrapText(x, `Yes: ${(r.yes||[]).map(i => P[i] ? lastName(P[i]) : i).join(", ")}`, 936).forEach(l => { x.fillText(l, 72, y); y += 44; });
    wrapText(x, `No: ${(r.no||[]).map(i => P[i] ? lastName(P[i]) : i).join(", ") || "none"}`, 936).forEach(l => { x.fillText(l, 72, y); y += 44; }); }
  x.fillStyle = "#A9C8FF"; x.font = `600 28px ${B}`; x.fillText("Official record linked at glassballot.org", 72, y + 20);
  x.fillStyle = "#FFFFFF"; x.font = `800 40px ${H}`; x.fillText("glassballot.org", 72, 1010);
  c.toBlob(blob => { const url = URL.createObjectURL(blob);
    out.innerHTML = `<img src="${url}" alt="Shareable image: ${esc(v.headline)}" style="border-radius:14px;border:1px solid var(--line);max-width:420px"><a class="btn" href="${url}" download="glassballot-${esc(id)}.png">Save image</a>`; }, "image/png");
}

/* ---------- corrections form ---------- */
const fixDlg = $("#fixDlg");
function openFix(btn) {
  const sent = Number(store.get("gb-fix-count") || 0);
  if (sent >= 5) { $("#fixQuote").textContent = "You've already sent several reports. Thank you. To send more, please email glassballotinfo@gmail.com with your links."; $("#fixForm").hidden = true; fixDlg.showModal(); return; }
  $("#fixForm").hidden = false; $("#fxMsg").textContent = "";
  $("#fxCounty").value = CK || ""; $("#fxPage").value = location.hash; $("#fxFact").value = btn.dataset.fix; $("#fxShown").value = btn.dataset.shown; $("#fxOpened").value = String(Date.now());
  $("#fixQuote").innerHTML = `<span class="tiny muted">You're reporting a problem with:</span><div style="font-weight:600">${esc(btn.dataset.shown || "This page")}</div>`;
  fixDlg.showModal();
}
$("#fixForm").addEventListener("submit", e => {
  const f = e.target, msg = $("#fxMsg");
  if (f.website.value) { e.preventDefault(); return; }
  if (Date.now() - Number($("#fxOpened").value || 0) < 4000) { e.preventDefault(); msg.textContent = "Please take a moment to check your link, then send."; return; }
  if (!/^https?:\/\/[^\s/]+\.[^\s]+$/.test(f.evidence.value.trim())) { e.preventDefault(); msg.textContent = "Please add a full link, starting with https://"; return; }
  if ((f.suggestion.value.match(/https?:\/\//g) || []).length > 2) { e.preventDefault(); msg.textContent = "Please put your link in the link box."; return; }
  store.set("gb-fix-count", String(Number(store.get("gb-fix-count") || 0) + 1));
});

/* ---------- ZIP lookup ---------- */
function zipLookup(z) {
  const msg = $("#zipMsg"); const hit = (DATA.zips || {})[z];
  if (!/^\d{5}$/.test(z)) { msg.textContent = "Please type a 5-digit ZIP code."; return; }
  if (!hit) { msg.innerHTML = `We don't cover that ZIP code yet. We cover ${ORDER.map(k => `<a href="#/${k}">${esc(cname(k))}</a>`).join(", ")} counties.`; return; }
  const ours = hit.filter(k => COUNTIES[k]);
  if (ours.length === 1 && !hit.includes("other")) { location.hash = "#/" + ours[0]; return; }
  msg.innerHTML = `ZIP ${esc(z)} crosses county lines. Which county do you live in? ${ours.map(k => `<a href="#/${k}">${esc(cname(k))}</a>`).join(" or ")}${hit.includes("other") ? " (or a county we don't cover yet)" : ""}`;
}

/* ---------- search ---------- */
function searchIndex() { const out = [];
  ORDER.forEach(k => { const c = COUNTIES[k], n = cname(k);
    c.people.forEach(p => out.push({h:`#/${k}/p/${p.id}`, t:p.name, s:`${p.office}${p.district ? ", District " + p.district : ""} · ${n}`}));
    c.votes.forEach(v => out.push({h:`#/${k}/v/${v.id}`, t:v.headline, s:`${voteDate(v)} · ${n}`}));
    c.races.forEach(r => out.push({h:`#/${k}/r/${r.id}`, t:r.title, s:`${n} County ballot`}));
    c.topics.forEach(t => out.push({h:`#/${k}/t/${t.id}`, t:t.name, s:`Topic · ${n}`})); });
  out.push({h:"#/about", t:"About Glass Ballot", s:"Who we are"}, {h:"#/standards", t:"Our standards", s:"How we work"});
  return out; }
function runSearch(q) { const ql = q.trim().toLowerCase(); const items = searchIndex().filter(i => !ql || (i.t + " " + i.s).toLowerCase().includes(ql)).slice(0, 14);
  $("#results").innerHTML = items.length ? items.map(i => `<a href="${i.h}"><span><b>${esc(i.t)}</b></span><span class="small muted" style="text-align:right">${esc(i.s)}</span></a>`).join("") : `<p class="muted">Nothing matches "${esc(q)}". Try a last name or a word like taxes.</p>`; }

/* ---------- router ---------- */
function notFound() { return `<div class="stack view"><h1 class="h1">We couldn't find that page</h1><p><a href="#/">Go to the start</a></p></div>`; }
const GLOBAL = {money:"about", about:"about", standards:"about", terms:"about", privacy:"about", accessibility:"about", corrections:"about", sources:"about", thanks:""};
function route() {
  if (location.pathname === "/thanks") { history.replaceState(null, "", "/#/thanks"); }
  let h = (location.hash || "#/").slice(1);
  const old = h.match(/^(p|v|r|t)-(.+)$/); if (old) { location.replace(`#/pinellas/${old[1]}/${old[2]}`); return; }
  if (["ballot","officials","votes","topics","problems"].includes(h)) { location.replace(`#/pinellas${h === "ballot" ? "" : "/" + h}`); return; }
  if (h === "how" || h === "/how") { location.replace("#/standards"); return; }
  const parts = h.replace(/^\//, "").split("/").filter(Boolean);
  let html, tab = "ballot";
  if (!parts.length) { CK = null; html = views.home(); tab = "home"; }
  else if (parts[0] in GLOBAL) { if (parts[0] === "sources") CK = null; html = views[parts[0]](); tab = GLOBAL[parts[0]]; }
  else if (useCounty(parts[0])) {
    const [, a, b] = parts;
    if (!a) html = views.ballot();
    else if (a === "officials") { html = views.officials(); tab = "officials"; }
    else if (a === "votes") { html = views.votes(); tab = "officials"; }
    else if (a === "vote") { html = views.vote(); tab = "vote"; }
    else if (a === "mylist") html = views.mylist();
    else if (a === "problems") { html = views.problems(); tab = "about"; }
    else if (a === "sources") { html = views.sources(); tab = "about"; }
    else if (a === "p") { html = views.person(b); tab = P[b] && P[b].race ? "ballot" : "officials"; }
    else if (a === "v") { html = views.vote_item(b); tab = "officials"; }
    else if (a === "r") html = views.race(b);
    else if (a === "t") { html = views.topic(b); tab = "officials"; }
    else if (a === "s") { html = views.source(b); tab = "about"; }
    else html = notFound();
  } else html = notFound();
  $("#app").innerHTML = html;
  const ck = CK || store.get("gb-county");
  $("#countyName").textContent = CK ? cname(CK) : (ck && COUNTIES[ck] ? cname(ck) : "County");
  document.querySelectorAll("[data-tab]").forEach(a => {
    const t = a.dataset.tab;
    if (t === "ballot") a.href = ck ? `#/${ck}` : "#/"; else if (t === "officials") a.href = ck ? `#/${ck}/officials` : "#/"; else if (t === "vote") a.href = ck ? `#/${ck}/vote` : "#/";
    if (t === tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  document.title = CK ? `${cname(CK)} County ballot guide | Glass Ballot` : "Glass Ballot | Tampa Bay local election guide";
  $("#search").hidden = true;
  window.scrollTo(0, 0);
}

function countyChoices() { $("#countyChoices").innerHTML = ORDER.map(k => `<a href="#/${k}" data-close><span class="body"><span class="title">${esc(COUNTIES[k].county.name)}</span><span class="tiny muted">${COUNTIES[k].races.filter(r => r.onNovBallot !== false).length} races on the Nov 3 ballot</span></span>${chev}</a>`).join("") + `<a href="#/" data-close><span class="body"><span class="title">Start over</span><span class="tiny muted">Look up by ZIP code</span></span>${chev}</a>`; }

function setBig(on) { document.documentElement.classList.toggle("big", on); $("#textSize").setAttribute("aria-pressed", String(on)); $("#textSize").setAttribute("aria-label", on ? "Make text smaller" : "Make text bigger"); store.set("gb-big", on ? "1" : ""); }
setBig(store.get("gb-big") === "1");

document.addEventListener("click", e => {
  const cl = e.target.closest("[data-close]"); if (cl) { cl.closest("dialog")?.close(); if (cl.tagName !== "A") return; }
  const fx = e.target.closest("[data-fix]"); if (fx) { openFix(fx); return; }
  const pk = e.target.closest("[data-pick]"); if (pk) { const [race, pid] = pk.dataset.pick.split("|"); setPick(CK, race, pid); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
  const mo = e.target.closest("[data-more]"); if (mo) { showAll.add(mo.dataset.more); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
  const d = e.target.closest("[data-district]"); if (d) { store.set("gb-district-" + CK, d.dataset.district); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
  const t = e.target.closest("[data-topic]"); if (t) { store.set("gb-topic-" + CK, t.dataset.topic); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
  const s = e.target.closest("[data-share]"); if (s) { makeShare(s.dataset.share); return; }
  if (e.target.closest("#textSize")) { setBig(!document.documentElement.classList.contains("big")); return; }
  if (e.target.closest("#pickCounty")) { countyChoices(); $("#countyDlg").showModal(); return; }
  if (e.target.closest("#openSearch")) { $("#search").hidden = false; $("#q").value = ""; runSearch(""); $("#q").focus(); return; }
  if (e.target.closest("#closeSearch")) { $("#search").hidden = true; return; }
  const jump = e.target.closest("[data-jump]"); if (jump) { e.preventDefault(); document.getElementById(jump.dataset.jump)?.scrollIntoView({behavior: "smooth"}); return; }
  const link = e.target.closest('a[href^="#"]'); if (link && link.getAttribute("href") === location.hash) { route(); }
});
document.addEventListener("submit", e => { if (e.target.id === "zipForm") { e.preventDefault(); zipLookup($("#zipIn").value.trim()); } });
document.querySelectorAll("dialog").forEach(dl => dl.addEventListener("click", e => { if (e.target === dl) dl.close(); }));
$("#q").addEventListener("input", e => runSearch(e.target.value));
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#search").hidden) $("#search").hidden = true; });
window.addEventListener("hashchange", route);

$("#foot").innerHTML = `<div class="wrap stack" style="gap:14px">
  <span class="wordmark">Glass<b>Ballot</b><i>.org</i></span>
  <p style="max-width:62ch">A free, independent guide to local elections in Tampa Bay. We don't endorse candidates or take money from campaigns. Information comes from public records and published reports and was last updated ${fmtDate(DATA.region.updated)}. Photos at the top of pages are illustrations.</p>
  <p class="row" style="gap:6px 18px"><a href="#/about">About</a><a href="#/standards">Our standards</a><a href="#/sources">Sources</a><a href="#/corrections">Corrections</a><a href="#/terms">Terms</a><a href="#/privacy">Privacy</a><a href="#/accessibility">Accessibility</a><a href="mailto:glassballotinfo@gmail.com">Contact</a></p>
</div>`;
route();
</script>
