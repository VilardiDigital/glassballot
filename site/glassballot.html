<title>Glass Ballot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Glass Ballot brand: Civic Blue, Glass Blue, Aqua, Glass Light, Charcoal, Mist Gray.
   Headings in Plus Jakarta Sans, body in Inter. The glass ballot box is the one bold element:
   it shows up as the logo, the hero, and the roll-call "boxes" that votes drop into. */
:root{
  --civic:#0B3D91; --glass:#2563EB; --aqua:#14B8A6; --light:#E8F6FF; --char:#1F2937; --mist:#CBD5E1;
  --paper:#FFFFFF; --wash:#F4F8FC; --ink:#1F2937; --muted:#556275; --line:#E2E8F0; --line-2:#CBD5E1;
  --ver-bg:#DCF5F1; --ver-fg:#0A6A5D;
  --sgl-bg:#E6EEFD; --sgl-fg:#0B3D91;
  --unv-bg:#FDF1D8; --unv-fg:#82500A;
  --cfl-bg:#F2E8FC; --cfl-fg:#6B2398;
  --unk-bg:#EEF2F6; --unk-fg:#475569;
  --head:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:20px; --r:14px; --r-sm:10px;
  --lift:0 1px 2px rgba(11,61,145,.05),0 8px 24px -12px rgba(11,61,145,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wash);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--glass);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--glass);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--head);text-wrap:balance;margin:0;line-height:1.15;color:var(--char);letter-spacing:-.015em}
p{margin:0}
img{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Masthead */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.5) blur(12px);-webkit-backdrop-filter:saturate(1.5) blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.logo img{width:38px;height:38px;object-fit:contain;margin-top:-4px}
.wordmark{font-family:var(--head);font-weight:800;font-size:21px;letter-spacing:-.03em;line-height:1;color:var(--civic);white-space:nowrap}
.wordmark b{color:var(--glass);font-weight:800}
.wordmark i{font-style:normal;color:#64748B;font-weight:700}
.topnav{display:none;gap:2px;margin-left:18px}
.topnav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
.topnav a[aria-current="page"]{color:var(--civic);background:var(--light)}
.topnav a:hover{color:var(--civic)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.countybtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--char)}
.countybtn svg{width:14px;height:14px;color:var(--muted)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);cursor:pointer;color:var(--char)}
@media (min-width:960px){.topnav{display:flex}}
@media (max-width:430px){.wordmark i{display:none}.top .wrap{gap:6px}.countybtn{padding:0 9px 0 12px}}
@media (max-width:350px){.wordmark{font-size:18px}.logo img{width:30px;height:30px}}

/* Bottom tabs on phones */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;text-decoration:none;color:#64748B;font-size:11.5px;font-weight:600}
.tabs a[aria-current="page"]{color:var(--glass)}
.tabs a[aria-current="page"] svg{background:var(--light)}
.tabs svg{width:44px;height:26px;padding:3px 11px;border-radius:999px}
@media (min-width:960px){.tabs{display:none}}
main{padding-block:20px calc(100px + env(safe-area-inset-bottom,0px));min-height:70vh}
@media (min-width:960px){main{padding-block:32px 72px}}

/* Type */
.kicker{font-size:13px;font-weight:600;color:var(--glass);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.kicker .sep{width:4px;height:4px;border-radius:50%;background:var(--mist)}
.h1{font-size:clamp(28px,6.4vw,46px);font-weight:800;letter-spacing:-.025em}
.h2{font-size:clamp(21px,4.4vw,26px);font-weight:800}
.h3{font-size:17px;font-weight:700}
.lede{font-size:17px;color:var(--muted);max-width:62ch}
@media (min-width:700px){.lede{font-size:18.5px}}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:6px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
@media (min-width:700px){.stack-lg{gap:40px}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
@media (min-width:700px){.panel{padding:22px}}
.split{display:grid;gap:24px}
@media (min-width:960px){.split{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}.split > .aside{position:sticky;top:84px}}

/* Labels */
.lab{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;line-height:1.35}
.lab svg{width:12px;height:12px;flex-shrink:0}
.lab.verified{background:var(--ver-bg);color:var(--ver-fg)}
.lab.single{background:var(--sgl-bg);color:var(--sgl-fg)}
.lab.unverified{background:var(--unv-bg);color:var(--unv-fg)}
.lab.conflict{background:var(--cfl-bg);color:var(--cfl-fg)}
.lab.unknown{background:var(--unk-bg);color:var(--unk-fg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--wash);border:1px solid var(--line);color:var(--char);white-space:nowrap}
.pill.blue{background:var(--civic);border-color:var(--civic);color:#fff}
.pill.wrap-ok{white-space:normal}

/* Sources under a fact */
.cite{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px;background:var(--paper);max-width:100%}
.src:hover{border-color:var(--glass);color:var(--civic)}
.src .t{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10.5px;font-weight:700;background:var(--wash);color:var(--char);flex-shrink:0}
.src .t.t1{background:var(--civic);color:#fff}
.src .t.t2{background:var(--glass);color:#fff}
.src span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fixbtn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--mist);text-underline-offset:3px}
.fixbtn:hover{color:var(--glass)}
.fixbtn svg{width:13px;height:13px}

/* Facts */
.facts{margin:0}
.fact{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:4px 18px;padding:14px 0;border-top:1px solid var(--line)}
.fact:first-child{border-top:0;padding-top:4px}
.fact dt{font-size:13.5px;color:var(--muted);font-weight:600}
.fact dd{margin:0;display:flex;flex-direction:column;gap:7px;min-width:0}
.fact .val{font-weight:500;color:var(--char)}
@media (max-width:560px){.fact{grid-template-columns:1fr}}
.versions{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-sm);background:var(--cfl-bg)}
.versions .v{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-width:0}
.versions b{overflow-wrap:anywhere;min-width:0}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* People */
.face{width:56px;height:56px;border-radius:16px;flex-shrink:0;object-fit:cover;object-position:50% 18%;background:linear-gradient(160deg,var(--light),#D3E6FB);display:inline-flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:800;font-size:18px;color:var(--civic);border:1px solid #D6E4F5;overflow:hidden}
.face.lg{width:112px;height:140px;border-radius:20px;font-size:34px}
.face.md{width:72px;height:88px;border-radius:16px;font-size:22px}
@media (max-width:560px){.face.lg{width:92px;height:116px}}
.who{display:flex;gap:14px;align-items:center;min-width:0}
.who b{font-family:var(--head);font-weight:700;font-size:16.5px;color:var(--char)}

/* List rows (used instead of card soup) */
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list > a,.list > .li{display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0}
.list > :first-child{border-top:0}
.list > a:hover{background:#F8FBFF}
.list .chev{margin-left:auto;color:var(--mist);flex-shrink:0}
.list .body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.list .title{font-weight:600;color:var(--char);line-height:1.35}

/* Buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid var(--line-2);background:var(--paper);color:var(--char)}
.btn.primary{background:var(--glass);border-color:var(--glass);color:#fff}
.btn.primary:hover{background:var(--civic);border-color:var(--civic)}
.btn:disabled{opacity:.55;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:700px){.chips{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}}
.chip{flex-shrink:0;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);font-weight:600;font-size:14px;cursor:pointer;color:var(--char)}
.chip[aria-pressed="true"]{background:var(--civic);color:#fff;border-color:var(--civic)}
input[type=search],input[type=text],input[type=email],input[type=url],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px}
input:focus,textarea:focus{border-color:var(--glass);outline:none;box-shadow:0 0 0 4px rgba(37,99,235,.15)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f span.h{font-weight:400;color:var(--muted);font-size:13px}

/* Hero: the glass ballot box over Tampa Bay */
.hero{position:relative;border-radius:28px;overflow:hidden;color:#fff;background:
  radial-gradient(120% 90% at 85% 10%,rgba(20,184,166,.35),transparent 55%),
  radial-gradient(90% 80% at 10% 100%,rgba(37,99,235,.55),transparent 60%),
  linear-gradient(160deg,rgba(11,61,145,.94) 0%,rgba(14,71,168,.88) 55%,rgba(26,86,208,.82) 100%),
  url(/assets/img/00-homepage-hero.webp) center 30%/cover no-repeat,#0B3D91;padding:28px 20px 22px}
@media (min-width:860px){.hero{padding:48px 48px 40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center}}
.hero h1{color:#fff;font-size:clamp(32px,8vw,56px);letter-spacing:-.03em;line-height:1.02}
.hero p{color:#DCE8FF;font-size:17px;max-width:46ch}
.hero .tag{font-family:var(--head);font-size:11.5px;letter-spacing:.32em;font-weight:700;color:#A9C8FF}
.hero .count{display:inline-flex;align-items:baseline;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-weight:600;font-size:14px;color:#fff;align-self:flex-start}
.hero .count b{font-family:var(--head);font-size:20px}
.mapwrap{position:relative;margin-top:18px}
@media (min-width:860px){.mapwrap{margin-top:0}}
.map{width:100%;height:auto;max-height:440px;display:block;margin:0 auto}
@media (max-width:859px){.map{max-height:300px}}
.map g.soon path{fill:rgba(232,246,255,.05);stroke:rgba(232,246,255,.35);stroke-dasharray:4 4}
.map g.soon text{fill:#A9C8FF;font-size:14px}
.map a path{fill:rgba(232,246,255,.16);stroke:rgba(232,246,255,.85);stroke-width:1.6;transition:fill .15s}
.map a:hover path,.map a:focus path{fill:rgba(20,184,166,.55)}
.map a.on path{fill:rgba(232,246,255,.42)}
.map text{font-family:var(--head);font-weight:800;font-size:17px;fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(11,61,145,.65);stroke-width:4px}
.map a:focus{outline:none}
.countylist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
@media (max-width:859px){.mapwrap{display:flex;flex-direction:column}.mapwrap .countylist{order:-1;margin:0 0 6px}}
.countylist .pick{grid-column:1/-1;font-family:var(--head);font-weight:700;color:#fff;font-size:15px}
.countylist a{display:flex;flex-direction:column;gap:1px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;text-decoration:none}
.countylist a:hover{background:rgba(255,255,255,.2)}
.countylist b{font-family:var(--head);font-size:16px}
.countylist span{font-size:12.5px;color:#C9DBFF}

/* County masthead band */
.band{border-radius:var(--r-lg);background:linear-gradient(160deg,var(--light),#F7FBFF 70%);border:1px solid #D9E9FB;padding:20px;display:flex;flex-direction:column;gap:10px}
@media (min-width:700px){.band{padding:28px}}
.band.pic{padding:0;overflow:hidden;display:grid;gap:0}
.band.pic .bt{padding:20px;display:flex;flex-direction:column;gap:10px}
.band.pic img{width:100%;height:132px;object-fit:cover;display:block;order:-1}
@media (min-width:760px){.band.pic{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.band.pic .bt{padding:30px}.band.pic img{height:100%;min-height:210px;order:0}}

/* Race card */
.race{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.race:hover{border-color:#B9D2F8;box-shadow:var(--lift)}
.race .rh{padding:16px 16px 0;display:flex;flex-direction:column;gap:4px}
.race .rp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);margin-top:14px;border-top:1px solid var(--line)}
.race .rp > div{background:var(--paper);padding:14px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.race .rp .face{width:60px;height:72px}
.race .go{padding:12px 16px;border-top:1px solid var(--line);font-weight:600;font-size:14px;color:var(--glass);background:#FAFCFF}

/* Votes */
.vote{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:28px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.04em;flex-shrink:0}
.vote.yes{background:var(--civic);color:#fff}
.vote.no{box-shadow:inset 0 0 0 2px var(--char);color:var(--char)}
.vote.absent,.vote.abstain{background:var(--unk-bg);color:var(--unk-fg)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.gbox{position:relative;border:2px solid #9CC2F5;border-radius:16px;background:linear-gradient(180deg,rgba(232,246,255,.6),rgba(37,99,235,.08));padding:40px 12px 12px;min-height:120px}
.gbox::before{content:"";position:absolute;top:-2px;left:50%;width:60px;height:7px;transform:translateX(-50%);background:var(--paper);border-left:2px solid #9CC2F5;border-right:2px solid #9CC2F5}
.gbox .gl{position:absolute;top:10px;left:14px;font-family:var(--head);font-size:14px;font-weight:800;color:var(--civic)}
.gbox .gn{position:absolute;top:6px;right:14px;font-family:var(--head);font-size:26px;font-weight:800;color:var(--civic)}
.slips{display:flex;flex-wrap:wrap;gap:6px}
.slip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;background:var(--paper);border:1px solid var(--line);color:var(--char)}
.slip.yes{background:var(--civic);color:#fff;border-color:var(--civic)}
.slip.no{box-shadow:inset 0 0 0 2px var(--char)}
.slip.empty{border-style:dashed;color:var(--muted);background:transparent}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px}
.stat{padding:12px 14px;border-radius:var(--r);background:var(--wash);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--head);font-size:24px;font-weight:800;color:var(--civic);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--glass),var(--aqua));border-radius:4px}
.part{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--light);border:1px solid #D3E6FB;font-size:14.5px;color:var(--char)}

/* Segmented control for long pages on phones */
.seg{display:flex;gap:4px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;position:sticky;top:68px;z-index:10;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg a{flex:1;text-align:center;white-space:nowrap;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.seg a.on{background:var(--civic);color:#fff}
@media (min-width:960px){.seg{display:none}}
@media (max-width:959px){.split.person [data-pane]:not(.show){display:none}}

/* Table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;vertical-align:top;padding:14px 16px;border-top:1px solid var(--line);font-size:14.5px}
thead th{border-top:0;font-size:15px;background:#FAFCFF}
tbody th{color:var(--muted);font-weight:600;width:160px;background:#FAFCFF}

/* Search + dialogs */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(244,248,252,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-top:calc(14px + env(safe-area-inset-top,0px));overflow:auto}
.overlay .wrap{display:flex;flex-direction:column;gap:12px;max-width:720px}
.results a{display:flex;justify-content:space-between;gap:12px;padding:13px 15px;border-radius:14px;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink);margin-bottom:8px}
dialog{border:0;border-radius:24px 24px 0 0;padding:0;width:100%;max-width:560px;margin:auto auto 0;max-height:92vh;box-shadow:0 -10px 40px rgba(11,61,145,.25)}

%; Joseph V. Citro 6.74%.","source":"soe-2011","when":"2011"},{"text":"2011 runoff, Tampa City Council District 4: Won. Julie Jenkins 39.26% (5,926).","source":"soe-2011r","when":"2011"},{"text":"2015 general, Tampa City Council District 4: Won. Kent S. King 28.8% (2,825).","source":"bp-cohen","when":"2015"},{"text":"2019 general, Mayor of Tampa: Lost (third place). Jane Castor 48.0% and David Straz 15.5% advanced to the runoff.","source":"bp-cohen","when":"2019"},{"text":"2020 Democratic primary, Hillsborough County Commission District 1: Won. Jen McDonald 45.8% (11,785).","source":"bp-cohen","when":"2020"},{"text":"2020 general, Hillsborough County Commission District 1: Won. Scott Levinson (R) 49.3% (88,803).","source":"bp-cohen","when":"2020"},{"text":"2022 general, Hillsborough County Commission District 1: Won. Scott Levinson (R) 49.6% (57,922). Primaries canceled.","source":"bp-cohen","when":"2022"},{"text":"2026 Democratic primary, Hillsborough County Commission District 1: Canceled; advanced without appearing on ballot. Faces Jackie Toledo (R) on Nov 3, 2026.","source":"bp-cohen","when":"2026"}],"keyPositions":[{"text":"Apr 20, 2022: Voted yes on placing the 1 percent transportation surtax ordinance on the Nov 8, 2022 ballot (RCS 3284, Ordinance 22-9), consistent with his 2020 pledge.","source":"clerk-votes-2022","when":"2022"},{"text":"Apr 17, 2024: Voted yes on the Community Investment Tax renewal referendum ordinance (RCS 4308, Ordinance 24-3).","source":"clerk-votes-2024","when":"2024"},{"text":"Jul 17, 2024: Voted yes on approving the School Board's Nov 5, 2024 operating-tax referendum (RCS 4437; failed 3 to 4).","source":"clerk-votes-2024","when":"2024"},{"text":"Aug 28, 2026: Voted yes on the Rays memorandum of understanding (RCS 5486) and the final Rays funding agreements (RCS 5622).","source":"clerk-votes-2026","when":"2026"},{"text":"Aug 28, 2026: Said before the Rays vote: \"This is our moment to decide what kind of community we want to be.\"","s  yet to check it against."}},"required":["party","inOfficeSince","raised","promises"],"links":[{"kind":"official","url":"https://hcfl.gov/commissioners/harry-cohen","source":"hc-cohen","tier":1}],"votes":[{"vote":"rays-final","how":"yes"},{"vote":"rays-mou","how":"yes"}],"score":{"overall":null,"parts":{"conflict_handling":null,"money_timing":null,"promise_match":null,"openness":50.0},"scoredVotes":2,"reason":"Not enough record yet: 2 of 25 scored votes loaded."}},{"id":"hagan","name":"Ken Hagan","office":"County Commissioner","district":"2","seatType":"Single-member","status":"incumbent","dig":{"promises":[{"text":"2024 campaign: Continue to make developers pay their fair share.","source":"site-hagan","when":"2024"},{"text":"2024 campaign: Fight to keep taxes low, budgets balanced, and county spending transparent.","source":"site-hagan","when":"2024"},{"text":"2024 campaign: Work with the Sheriff to keep families safe and fund new initiatives to reduce violent crimes.","source":"site-hagan","when":"2024"},{"text":"2024 campaign: Focus on keeping housing affordable, especially in urban cores.","source":"site-hagan","when":"2024"},{"text":"2024 campaign: Develop new programs and projects that protect the quantity and quality of drinking water.","source":"site-hagan","when":"2024"},{"text":"2022 campaign: In his 2022 race he highlighted opposing a brownfield designation for the former Pebble Creek Country Club, objecting to a yard waste incinerator zoning change in Lutz, backing a New Tampa Performing Arts Center and seeking funds for residential road paving.","source":"yahoo-2022","when":"2022"},{"text":"2018 campaign: Proposed adding $250,000 to the county budget to speed a potential Kinnan Street connection to Mansfield Boulevard (reported during his 2018 District 2 campaign).","source":"nno-hagan-2018","when":"2018"}],"electionHistory":[{"text":"2002 general, Hillsborough County Commission District 2: Won (first elected). County page says first elected in 2002. Official 2002 results are not on the SOE results archive, so vote share is not available.","source":"hc-hagan","when":"2002"},{"text":"2006 general, Hillsborough County Commission District 2: Kept seat; no District 2 contest appears in the official 2006 primary or general results. Neighborhood News reports he held District 2 from 2002 to 2010. The SOE results do not say whether he was unopposed.","source":"soe-2006g","when":"2006"},{"text":"2010 general, Hillsborough County Commission District 5 (countywide): Won. Linda Saul-Sena (DEM) 42.49% (131,504); Jim Hosler (NPA) 4.83% (14,957). No District 5 contest in the 2010 primary results.","source":"soe-2010g","when":"2010"},{"text":"2014 general, Hillsborough County Commission District 5 (countywide): Re-elected. Osprey Observer (Dec 17, 2014) calls him re-elected for Countywide District 5. SOE ENR pages soe-2014p and soe-2014g list no District 5 race.","source":"osprey-2014","when":"2014"},{"text":"2018 Republican primary, Hillsborough County Commission District 2: Won. Chris Paradies 27.6% (7,504).","source":"bp-hagan","when":"2018"},{"text":"2018 general, Hillsborough County Commission District 2: Won. Angela Birdsong (D) 47.6% (67,378).","source":"bp-hagan","when":"2018"},{"text":"2022 general, Hillsborough County Commission District 2: Won. Angela Birdsong (D) 43.4% (54,444). Republican primary canceled.","source":"bp-hagan","when":"2022"},{"text":"2024 Republican primary, Hillsborough County Commission District 2: Won. Melissa Nordbeck 21.8% (4,188).","source":"bp-hagan","when":"2024"},{"text":"2024 general, Hillsborough County Commission District 2: Won. Patricia Altagracia Alonzo (D) 44.9% (74,084). Term ends 2028.","source":"bp-hagan","when":"2024"}],"keyPositions":[{"text":"Aug 28, 2026: Voted yes on the Development and Funding Agreement, Guaranty and Team Non-Relocation Agreement for a Rays ballpark (RCS 5622; passed 5 to 2).","source":"clerk-votes-2026","when":"2026"},{"text":"Aug 28, 2026: Before the Rays v istrict 5: Won with 59.8% (12,271 votes). Others: Kevin Hohn (REP) 40.2%","source":"enr-2020p","when":"2020"},{"text":"2020 general, County Commission District 5: Won with 64.5% (66,256 votes). Others: Michael Burmann (NPA) 35.5%","source":"enr-2020g","when":"2020"},{"text":"2024 Republican primary, County Commission District 5: Won with 69.4% (13,096 votes). Others: Pam Everett (REP) 30.6%. No District 5 contest on the Nov 5, 2024 general results page. County records say he was re-elected Nov 19, 2024.","source":"enr-2024p","when":"2024"}],"keyPositions":[{"text":"Sep 19, 2017: Lobbyist registration ordinance. Said there was no consensus to bring it forward. Said \"there was not a consensus to bring a lobbying ordinance forward\" and argued it should not have been placed on the agenda.","source":"tbt-2017-lobby","when":"2017"},{"text":"Jan 30, 2019: Firing County Administrator Leonard Sossamon. Voted no (passed 3-2). Said: \"I think it sets us back. We had a seven-year tenured administrator.\"","source":"bn9-2019-admin","when":"2019"},{"text":"Sep 10, 2019: Second Amendment support letter and resolution. Proposed. Asked the board to send a letter to Gov. DeSantis affirming support for the Second Amendment: \"It doesn't change policy ... but it does send a message to Tallahassee.\" In December 2019 the Tampa Bay Times reported he spearheaded the resolution declaring the county a \"Second Amendment sanctuary\" (vote count not readable).","source":"sun-2019-2a","when":"2019"},{"text":"Mar 7, 2023: Impact fee increases (workshop). Opposed any increase. Said: \"Growth is not guaranteed, and it's not happening right now.\"","source":"sun-2023-impact","when":"2023"},{"text":"Mar 28, 2023: Surplus county property sales. Voted no (adopted 3-2).","source":"legistar-2023-03-28","when":"2023"},{"text":"Study of raising school impact fees all at once. Voted no (study approved 3-2). Said he \"did not favor a fee increase in the first year without a tax decrease and would vote against it.\"","source":"suncoast-impact-study"},{"text":"Nov 19, 2024: Sheriff's Office cyber security funds (Item P-6). Voted no (passed 3-2).","source":"legistar-2024-11-19","when":"2024"},{"text":"Jan 24, 2026: Flock license plate reader cameras. Opposed the automated cameras. Said: \"This is not an attack on the Sheriff or law enforcement.\" and \"But the Constitution is absolute; it has to be followed.\"","source":"sun-2026-flock","when":"2026"},{"text":"May 8, 2026: Half-cent sales tax referendum for roads. Voted yes (motion failed 3-2). Said: \"We have to do something about the roads.\"","source":"sun-roads","when":"2026"},{"text":"Sep 21, 2026: FY 2027 Sheriff's Office budget. Supported the sheriff's budget. Thanked Sheriff Al Nienhuis for removing the Flock cameras. His own vote on the 4-1 budget resolution was not reported.","source":"tbb-budget","when":"2026"}],"conflicts":[{"text":"The Florida Commission on Ethics listed a complaint against \"STEVE D. CHAMPION, Hernando County Commissioner\" among complaints it \"dismissed ... for lack of legal sufficiency\" at its Dec 6, 2024 meeting. The release gives no details of the allegation. Legal sufficiency review involves no factual investigation.","source":"coe-dec24","when":"2024"}]},"facts":{"party":{"value":"Republican","label":"single","sources":["soe-offices","soe-dir-elected"],"note":"One official record, nothing yet to check it against."},"inOfficeSince":{"value":"Elected 2016; re-elected 2020 and 2024","label":"single","sources":["hc-districts"],"note":"One official record, nothing yet to check it against."},"term":{"value":"2024 to 2028 (term expires Nov 2028)","label":"single","sources":["hc-districts"],"note":"One official record, nothing yet to check it against."},"leadership":{"value":"2nd Vice Chair","label":"single","sources":["hc-bcc"],"note":"One official record, nothing yet to check it against."},"job":{"value":null,"label":"unknown","sources":[]},"roles":{"value":null,"label":"unknown","sour /* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = iso => { if (!iso) return ""; const [y,m,d] = iso.split("-").map(Number); return `${MONTHS[m-1]} ${d}, ${y}`; };
const voteDate = v => v.date ? fmtDate(v.date) : (v.dateNote || "Date not confirmed yet");
const initials = n => n.replace(/[^A-Za-zÀ-ÿ .-]/g,"").split(/\s+/).filter(w => w && !/^(Jr\.?|Sr\.?|III|II|Dr\.)$/.test(w)).map(w => w[0]).slice(0,2).join("").toUpperCase();
const lastName = p => p.name.replace(/,? (Jr\.?|Sr\.?|III|II)$/,"").split(" ").pop();
const firstName = p => p.name.replace(/^Dr\.\s+/,"").split(" ")[0];
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const chev = `<svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const ORDER = DATA.order;
const COUNTIES = DATA.counties;
const HTV = DATA.howToVote || {statewide: [], counties: {}, jobs: {}};

let CK = null, C = null, P = {}, V = {}, R = {}, T = {}, S = {};
function useCounty(k) {
  if (!COUNTIES[k]) return false;
  CK = k; C = COUNTIES[k];
  P = Object.fromEntries(C.people.map(p => [p.id, p]));
  V = Object.fromEntries(C.votes.map(v => [v.id, v]));
  R = Object.fromEntries(C.races.map(r => [r.id, r]));
  T = Object.fromEntries(C.topics.map(t => [t.id, t]));
  S = C.sources;
  store.set("gb-county", k);
  return true;
}
const cname = k => COUNTIES[k].county.name.replace(" County", "");
const href = (path = "") => `#/${CK}${path ? "/" + path : ""}`;

/* How sure we are, in plain words */
const LAB = {
  verified:{t:"Verified", d:"A government record says this, and a second source we trust agrees.", i:'<path d="M2.5 6.5l2.5 2.5L9.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'},
  single:{t:"Government record", d:"This comes from a government record, such as meeting minutes or election filings.", i:'<circle cx="6" cy="6" r="3" fill="currentColor"/>'},
  unverified:{t:"Not yet confirmed", d:"This comes from news reports, research groups or the candidate. We haven't matched it to a government record yet.", i:'<path d="M6 3v4M6 9h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'},
  conflict:{t:"Sources disagree", d:"Our sources say different things. We show each version so you can see the difference.", i:'<path d="M2 4h6l-2-2M10 8H4l2 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'},
  unknown:{t:"Not found yet", d:"We looked and couldn't find this in any record yet.", i:'<path d="M4.5 4.5a1.6 1.6 0 1 1 2.2 1.5c-.5.2-.7.6-.7 1M6 9.2h.01" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'}
};
const TIERS = {1:["Government record","Meeting minutes, election filings, certified results and official county pages"],2:["Other government source","Meeting video, agenda packets and government press releases"],3:["Research group","Nonpartisan databases such as Ballotpedia and The Ballot Brief"],4:["News report","Local and state news coverage"],5:["From the candidate","Campaign websites and posts. We treat these as the candidate's own words, not as facts"]};
const chip = (label, note) => { const l = LAB[label] || LAB.unknown; return `<span class="lab ${label}" title="${esc(note || l.d)}"><svg viewBox="0 0 12 12" aria-hidden="true">${l.i}</svg>${l.t}</span>`; };
const srcLinks = ids => { const seen = new Set(); const u = [...new Set(ids || [])].filter(id => S[id]).filter(id => { const k = S[id].publisher + S[id].tier; if (seen.has(k)) return false; seen.add(k); return true; }); if (!u.length) return ""; return u.map(id => { const s = S[id]; return `<a class="src" href="${href("s/" + id)}" title="${esc(TIERS[s.tier]?.[0] || "")}: ${esc(s.title)}"><span class="t t${s.tier}">${s.tier}</span><span>${esc(s.publisher)}</span></a>`; }).join(""); };
const valueText = v => Array.isArray(v) ? `<ul class="plain">${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : esc(typeof v === "object" && v ? JSON.stringify(v) : v);
const shownText = v => Array.isArray(v) ? v.join("; ") : (typeof v === "object" && v ? JSON.stringify(v) : String(v ?? ""));
const PENCIL = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13l1-3.5L11 2.5l2.5 2.5L6.5 12z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const fixBtn = (factId, shown) => `<button class="fixbtn icon" type="button" data-fix="${esc(factId)}" data-shown="${esc(String(shown).slice(0,400))}" title="Report a mistake in this fact">${PENCIL}<span>Report a mistake in this fact</span></button>`;
const fixLink = (factId, shown, text = "Something wrong on this page? Tell us.") => `<button class="fixbtn" type="button" data-fix="${esc(factId)}" data-shown="${esc(String(shown).slice(0,400))}">${PENCIL}${esc(text)}</button>`;

function factBlock(fact, factId, opts = {}) {
  if (!fact || fact.label === "unknown") return `<div class="row">${chip("unknown")}<span class="muted small">${esc(opts.unknownText || "We haven't found this yet.")}</span>${fixBtn(factId, "Not found")}</div>`;
  if (fact.label === "conflict") {
    const vs = fact.versions.map(v => `<div class="v"><b>${valueText(v.value)}</b>${srcLinks(v.sources)}${v.official ? '<span class="pill">Government record</span>' : ""}</div>`).join("");
    return `<div class="row">${chip("conflict")}<span class="small muted">${fact.value ? "The government record is listed first." : "There's no government record yet, so we show both."}</span></div><div class="versions">${vs}</div><div class="cite">${fixBtn(factId, fact.versions.map(v => shownText(v.value)).join(" | "))}</div>`;
  }
  const other = (fact.otherReports || []).length ? `<details class="tiny muted"><summary style="cursor:pointer">Other reports say it a little differently</summary><div class="stack-sm" style="margin-top:6px">${fact.otherReports.map(o => `<div>${valueText(o.value)} <span class="cite" style="display:inline-flex">${srcLinks(o.sources)}</span></div>`).join("")}</div></details>` : "";
  return `<div class="val">${valueText(fact.value)}</div><div class="cite">${chip(fact.label, fact.note)}${srcLinks(fact.sources)}${fixBtn(factId, shownText(fact.value))}</div>${other}`;
}

const photoOf = p => { const f = p.facts && p.facts.photo; return f && f.label !== "unknown" && typeof f.value === "string" && /^https:\/\//.test(f.value) ? f.value : null; };
const face = (p, size = "") => { const u = photoOf(p); const ini = esc(initials(p.name));
  return u ? `<img class="face ${size}" src="${esc(u)}" alt="Photo of ${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer" data-ini="${ini}">` : `<span class="face ${size}" aria-hidden="true">${ini}</span>`; };
document.addEventListener("error", e => { const t = e.target; if (t.tagName === "IMG" && t.classList.contains("face")) { const s = document.createElement("span"); s.className = t.className; s.textContent = t.dataset.ini || ""; s.setAttribute("aria-hidden", "true"); t.replaceWith(s); } }, true);

const isCountywide = r => /at-large|countywide/i.test(r.seatType || "") || r.countywide;
const raceDistrict = r => r.district || ((r.id.match(/-d(\d+)$/) || [])[1]);
const whoVotes = r => r.who || (isCountywide(r) ? `Every ${cname(CK)} County voter` : `Only voters who live in District ${raceDistrict(r)}`);

const jobSrc = r => { const j = HTV.jobs && HTV.jobs[isSchool(r) ? "school-board" : "county-commission"]; return j && j.url ? ` <a class="tiny" href="${esc(j.url)}" target="_blank" rel="noopener">Source: ${esc(j.publisher || "")}</a>` : ""; };

function rollOf(v) { const r = v.roll; const base = r.value || (r.versions && r.versions[0] && r.versions[0].value) || null; if (!base) return null; return {...base, ...(v.rollExtra || {})}; }

/* ---------- officials ---------- */
function agreement(bcc) {
  const split = C.votes.filter(v => v.split);
  if (split.length < 5) return "";
  const side = (v, id) => { const r = rollOf(v) || {}; if ((r.yes||[]).includes(id)) return "y"; if ((r.no||[]).includes(id)) return "n"; return null; };
  const pairStat = (a, b) => { let same = 0, both = 0; split.forEach(v => { const x = side(v,a), y = side(v,b); if (x && y) { both++; if (x === y) same++; } }); return {same, both, pct: both ? Math.round(100*same/both) : null}; };
  // A vote "decided" the outcome if switching it alone would have flipped the result (ties fail).
  const per = bcc.map(p => {
    let won = 0, lost = 0, decided = 0, cast = 0;
    split.forEach(v => {
      const r = rollOf(v) || {}; const y = (r.yes||[]).length, n = (r.no||[]).length, me = side(v, p.id);
      if (!me) return; cast++;
      const passed = y > n, onWin = (me === "y") === passed;
      onWin ? won++ : lost++;
      if (onWin && (passed ? y - n <= 2 : n - y <= 1)) decided++;
    });
    return {p, won, lost, decided, cast};
  });
  const pairs = [];
  bcc.forEach((a, i) => bcc.slice(i + 1).forEach(b => { const st = pairStat(a.id, b.id); if (st.both >= 5) pairs.push({a, b, ...st}); }));
  pairs.sort((x, y) => y.pct - x.pct);
  const close = pairs.slice(0, 2), far = pairs.length ? pairs[pairs.length - 1] : null;
  const ballot = per.filter(x => x.p.race);
  const nm = p => esc(p.name);
  const head = bcc.map(p => `<th scope="col">${esc(lastName(p))}</th>`).join("");
  const rows = bcc.map(a => `<tr><th scope="row">${esc(a.name)}</th>${bcc.map(b => { if (a.id === b.id) return `<td class="muted">·</td>`; const n = pairStat(a.id,b.id).pct; return `<td class="num" style="font-weight:${n >= 75 ? 700 : 400};color:${n >= 75 ? "var(--civic)" : "inherit"}">${n == null ? "–" : n + "%"}</td>`; }).join("")}</tr>`).join("");
  return `<section class="panel stack" aria-labelledby="vt"><h2 class="h2" id="vt">Who votes with whom, and why it matters to you</h2>
    <p>Most items pass with everyone agreeing. The ${split.length} votes where commissioners split are where your choice of commissioner actually changes what the county does. It takes ${Math.floor(bcc.length / 2) + 1} of ${bcc.length} votes to pass anything.</p>
    ${ballot.length ? `<div class="panel stack-sm" style="background:var(--light);border:0"><h3 class="h3">The seat${ballot.length > 1 ? "s" : ""} on your ballot</h3>${ballot.map(x => `<p><b>${nm(x.p)}</b>${x.p.district ? ` (District ${esc(x.p.district)})` : ""} cast the vote that decided the outcome on <b class="num">${x.decided}</b> of these ${split.length} split votes. If that seat had voted the other way, those decisions would have gone the other way.</p>`).join("")}<p class="small muted">Whoever wins ${ballot.length > 1 ? "these seats inherits" : "this seat inherits"} that weight.</p></div>` : ""}
    ${close.length ? `<p><b>Most often on the same side:</b> ${close.map(x => `${nm(x.a)} and ${nm(x.b)} (${x.pct}% of ${x.both} split votes)`).join("; ")}.${far && far.pct < 60 ? ` <b>Least often:</b> ${nm(far.a)} and ${nm(far.b)} (${far.pct}%).` : ""}</p>` : ""}
    <div class="tablewrap"><table><thead><tr><th scope="col">Commissioner</th><th scope="col">On the winning side</th><th scope="col">On the losing side</th><th scope="col">Their vote decided it</th></tr></thead>
      <tbody>${per.map(x => `<tr><th scope="row"><a href="${href("p/" + x.p.id)}">${nm(x.p)}</a></th><td class="num">${x.won}</td><td class="num">${x.lost}</td><td class="num">${x.decided}</td></tr>`).join("")}</tbody></table></div>
    <p class="small muted">"Their vote decided it" means switching that one vote would have flipped the result. A tie fails. Voting together is not a sign of a deal; people who share views vote alike. Counts cover the split votes we have loaded, listed on the votes page.</p>
    <details class="more"><summary>See every pair</summary>
      <p class="small muted" style="margin:8px 0">How often each pair voted the same way on the ${split.length} split votes.</p>
      <div class="tablewrap"><table style="min-width:640px"><thead><tr><th scope="col"><span class="sr">Commissioner</span></th>${head}</tr></thead><tbody>${rows}</tbody></table></div></details>
  </section>`;
}

views.officials = () => {
  const bcc = C.people.filter(p => p.office === "County Commissioner").sort((a,b) => String(a.district).localeCompare(String(b.district), undefined, {numeric:true}));
  const others = C.people.filter(p => p.office !== "County Commissioner" && p.status !== "former");
  const row = p => `<a href="${href("p/" + p.id)}">${face(p)}<span class="body">
      <span class="title" style="font-family:var(--head);font-size:17px">${esc(p.name)}</span>
      <span class="small muted">${p.district ? `District ${esc(p.district)}` : ""}${partyOf(p) ? " · " + esc(partyOf(p)) : ""}</span>
      ${p.race ? `<span class="pill blue" style="align-self:flex-start;margin-top:4px">On your Nov 3 ballot</span>` : ""}
    </span>${chev}</a>`;
  return `<div class="stack-lg view">
    ${band(esc(C.county.name), "Your county commissioners", `These ${bcc.length} people run ${esc(cname(CK))} County government right now. Tap a name to see how they've voted and who funds their campaigns.`, "10-local-government-boardroom")}
    <div class="list">${bcc.map(row).join("")}</div>
    <p class="small"><a href="${href("votes")}">See what the commission has voted on</a></p>
    ${agreement(bcc)}
    ${others.length ? `<section class="stack"><h2 class="h2">Other candidates on your ballot</h2><div class="list">${others.map(row).join("")}</div></section>` : ""}
  </div>`;
};

const SCORE_PARTS = [
  ["conflict_handling","Conflicts of interest","When they or a donor had something to gain, did they say so and sit out the vote?","We need their state financial disclosure forms first."],
  ["money_timing","Money and timing","How much of their campaign money did NOT come from a donor within 90 days of a vote about that donor.","Needs their campaign reports matched to their votes."],
  ["promise_match","Promises kept","Did their votes match what they said they would do?","Needs their campaign promises matched to votes."],
  ["openness","Showing up","Do they file disclosure forms on time and come to meetings?","Needs filing dates and meeting attendance."]
];
function scoreCard(p) {
  const s = p.score; if (!s) return "";
  const parts = SCORE_PARTS.map(([k, name, q, need]) => { const val = s.parts[k];
    return `<div class="part"><div><div style="font-weight:600">${name}</div><div class="small muted">${val == null ? need : q}</div></div><div class="num" style="font-family:var(--head);font-weight:800;color:var(--civic)">${val == null ? '<span class="tiny muted" style="font-family:var(--body);font-weight:500">Not enough data</span>' : val}</div></div>`; }).join("");
  return `<details class="more panel"><summary>Pocket or Public: who benefits from their votes? (in progress)</summary>
    <p class="small muted" style="margin:8px 0">A score from 0 to 100 built only from public records, never from party. We only show an overall number once there's enough data. <a href="#/standards">How it works</a></p>
    <div>${parts}</div></details>`;
}

function glance(p) {
  const v = f => { const x = p.facts[f]; return x && x.label !== "unknown" ? (x.value != null ? shownText(x.value) : "Sources disagree") : null; };
  const items = [["Party", partyOf(p) || (p.nonpartisan ? "Nonpartisan race" : null)], ["In office since", v("inOfficeSince")], ["Money raised", v("raised")],
    ["Votes cast", p.tally ? (p.tally.aye + p.tally.nay + p.tally.abstain).toLocaleString() : null], ["Attendance", v("attendance")]].filter(([, x]) => x);
  if (!items.length) return "";
  return `<section aria-label="At a glance"><div class="glance">${items.map(([k, x]) => `<div><span class="k">${k}</span><span class="v">${esc(String(x).length > 90 ? String(x).slice(0, 88) + "…" : x)}</span></div>`).join("")}</div></section>`;
}

const LINK_KINDS = {official:"Official county page", campaign:"Campaign website", facebook:"Facebook", x:"X (Twitter)", instagram:"Instagram", linkedin:"LinkedIn", youtube:"YouTube", tiktok:"TikTok"};
function linksBlock(p) {
  const ls = (p.links || []).slice().sort((a,b) => Object.keys(LINK_KINDS).indexOf(a.kind) - Object.keys(LINK_KINDS).indexOf(b.kind));
  if (!ls.length) return `<p class="small muted">We haven't confirmed a website or social media account for ${esc(firstName(p))} yet. ${fixBtn(`${CK}/person/${p.id}/links`, "No links on file")}</p>`;
  return `<div class="row" style="gap:8px">${ls.map(l => `<a class="btn" style="min-height:44px;padding:0 14px;font-size:15px" href="${esc(l.url)}" target="_blank" rel="noopener nofollow">${esc(LINK_KINDS[l.kind] || "Link")}</a>`).join("")}${fixBtn(`${CK}/person/${p.id}/links`, ls.map(l => l.url).join(" "))}</div>
    <p class="tiny muted">We only list accounts we could confirm through their campaign website, the county or election filings.</p>`;
}

const DIG_PARTS = [["electionHistory","Election history","How they won (or got) the seat each time. Official results where we could open them."],["promises","Past campaign promises","What they said when running before, in their own words or as reported. A promise, not a fact."],["keyPositions","Positions taken in office","Stands they took on the record: votes, motions and public statements."],["conflicts","Ethics and conduct records","Ethics complaints, opinions or concerns raised in public, with their response when we have it. None of these is a finding of wrongdoing unless it says so."],["checked","What we searched and found nothing","Records we checked for this person that turned up no ethics findings or recusals."]];
function trackRecord(p, fn) {
  const d = p.dig || {};
  const parts = DIG_PARTS.filter(([k]) => (d[k] || []).length);
  if (!parts.length) return "";
  return `<section class="panel stack" aria-labelledby="tr"><h2 class="h2" id="tr">${fn}'s track record</h2>
    <p class="small muted">Each line links to the record or report it came from. If something is wrong or missing, tell us.</p>
    ${parts.map(([k, title, note]) => `<div class="stack-sm"><h3 class="h3">${title}</h3><p class="tiny muted">${note}</p>
      <ul class="plain stack-sm">${d[k].map((r, i) => `<li><span>${esc(r.text)}</span><div class="cite">${srcLinks([r.source])}${fixBtn(`${CK}/person/${p.id}/${k}-${i}`, r.text)}</div></li>`).join("")}</ul></div>`).join("")}
  </section>`;
}

views.person = id => {
  const p = P[id]; if (!p) return notFound();
  const race = p.race ? R[p.race] : null;
  const rivals = race ? race.people.filter(x => x !== p.id).map(x => P[x]).filter(Boolean) : [];
  const shown = Object.keys(FIELD_NAMES).filter(f => f !== "party" && p.facts[f] && (p.facts[f].label !== "unknown" || p.required.includes(f)));
  const moneyShown = Object.keys(MONEY_FIELDS).filter(f => p.facts[f] && (p.facts[f].label !== "unknown" || f === "raised"));
  const cnx = (p.connections || []).slice().sort((a,b) => (b.inWindow - a.inWindow) || (b.amount - a.amount));
  const promises = p.facts.promises;
  const myVotes = p.votes.map(x => ({...x, v: V[x.vote]})).filter(x => x.v);
  const allSources = [...new Set([...Object.values(p.facts).flatMap(f => f.sources || (f.versions || []).flatMap(v => v.sources || [])), ...Object.values(p.dig || {}).flat().map(r => r.source)])].filter(id => S[id]);
  const fid = f => `${CK}/person/${p.id}/${f}`;
  const fn = esc(firstName(p));
  return `<div class="stack-lg view">
    <a class="back" href="${race ? href("r/" + race.id) : href("officials")}">‹ ${race ? esc(race.title) : `${esc(cname(CK))} commissioners`}</a>
    <section class="who" style="gap:18px;align-items:flex-end">
      ${face(p, "lg")}
      <div class="stack-sm" style="min-width:0">
        <h1 class="h1">${esc(p.name)}</h1>
        <p class="lede" style="font-size:17px">${esc(p.office)}${p.district ? `, District ${esc(p.district)}` : ""}${partyOf(p) ? ` · ${esc(partyOf(p))}` : ""}</p>
        <div class="row">${race ? `<a class="pill blue" href="${href("r/" + race.id)}" style="text-decoration:none">On your Nov 3 ballot</a>` : ""}<span class="pill">${statusText(p)}</span></div>
      </div>
    </section>
    ${glance(p)}
    ${rivals.length ? `<section class="panel stack-sm"><div class="between"><h2 class="h3">Running against</h2><a class="small" href="${href("r/" + race.id)}">Compare them side by side</a></div><div class="row" style="gap:18px">${rivals.map(r => `<a class="who" href="${href("p/" + r.id)}" style="text-decoration:none">${face(r)}<b>${esc(r.name)}</b></a>`).join("")}</div></section>` : ""}

    <section class="panel stack" aria-labelledby="ab"><h2 class="h2" id="ab">About ${fn}</h2>
      <dl class="facts">${p.facts.party && !p.nonpartisan ? `<div class="fact"><dt>Party</dt><dd>${factBlock(p.facts.party, fid("party"))}</dd></div>` : ""}${shown.map(f => `<div class="fact"><dt>${FIELD_NAMES[f]}</dt><dd>${factBlock(p.facts[f], fid(f))}</dd></div>`).join("")}</dl>
      <h3 class="h3" style="margin-top:6px">Website and social media</h3>${linksBlock(p)}
    </section>

    <section class="stack" aria-labelledby="hv">
      <h2 class="h2" id="hv">How ${fn} has voted</h2>
      ${p.tally ? `<div class="stats">${[["Yes",p.tally.aye],["No",p.tally.nay],["Absent",p.tally.absent],["Abstained",p.tally.abstain]].map(([k,n]) => `<div class="stat"><b>${n.toLocaleString()}</b><span class="small muted">${k}</span></div>`).join("")}</div>
        <p class="small muted">Every vote recorded in the county's official meeting records since ${esc(C.legistarScope || "this term began")}. Most items pass with everyone agreeing. Below are the votes where commissioners disagreed, plus a few big decisions.</p>` : ""}
      ${myVotes.length ? `<div class="list">${myVotes.slice(0, showAll.has(p.id) ? 999 : 8).map(({how, v}) => `<a href="${href("v/" + v.id)}"><span class="vote ${how}">${how.toUpperCase()}</span><span class="body"><span class="title">${esc(v.headline)}</span><span class="tiny muted">${esc(voteDate(v))}${itemRef(v) ? " · " + itemRef(v) : ""}${v.result.value ? " · " + esc(v.result.value) : ""}</span></span>${chev}</a>`).join("")}</div>`
        : `<div class="panel small muted">${p.status !== "incumbent" ? `${fn} hasn't served on this board, so there are no votes to show.` : "We haven't loaded individual votes for this person yet."}</div>`}
      ${myVotes.length > 8 && !showAll.has(p.id) ? `<button class="btn" type="button" data-more="${p.id}">Show all ${myVotes.length} votes</button>` : ""}
    </section>

    <section class="panel stack" aria-labelledby="mo"><h2 class="h2" id="mo">Who is paying for the campaign</h2>
      <dl class="facts">${moneyShown.map(f => `<div class="fact"><dt>${MONEY_FIELDS[f]}</dt><dd>${factBlock(p.facts[f], fid(f), {unknownText: "No campaign finance reports on file yet."})}</dd></div>`).join("")}</dl>
      ${fundingBlock(p, fid)}
      ${C.county.financeUrl ? `<p class="small muted">Every donation, with the donor's name, date and amount, is in the <a href="${esc(C.county.financeUrl)}" target="_blank" rel="noopener">Supervisor of Elections campaign reports</a>.</p>` : ""}
    </section>

    ${cnx.length ? `<section class="stack" aria-labelledby="cx">
      <h2 class="h2" id="cx">Donors who had business before the commission</h2>
      <p class="small muted">Giving to a campaign is legal and public. We list these so you can see the connection. It is not a claim that anyone did something wrong.</p>
      ${cnx.map((c, i) => `<article class="panel stack-sm">
        <p><b>${esc(c.donor)}</b> gave <span class="num">$${c.amount.toLocaleString()}</span>, most recently on ${fmtDate(c.date)}.${c.inWindow ? " That was within 90 days of a vote about them." : ""}</p>
        ${c.votes.length ? `<ul class="plain small">${c.votes.map(v => `<li>${esc(v)}</li>`).join("")}</ul>` : ""}
        ${c.note ? `<p class="small muted">${esc(c.note)}</p>` : ""}
        <div class="cite">${chip(c.label)}${srcLinks(c.sources)}${fixBtn(`${CK}/person/${p.id}/connection-${i}`, `${c.donor} gave $${c.amount}`)}</div>
      </article>`).join("")}
    </section>` : ""}

    <section class="panel stack" aria-labelledby="pr"><h2 class="h2" id="pr">What ${fn} says they'll do</h2>
      ${!promises || promises.label === "unknown" ? `<p class="small muted">${(p.dig?.promises || []).length ? `We haven't found a list of priorities for this campaign yet. What ${fn} promised in past campaigns is under <a href="#tr" data-jump="tr">track record</a> below.` : "We haven't found a list of priorities from this campaign yet."} ${fixBtn(fid("promises"), "None on file")}</p>` : `${valueText(promises.value)}<div class="cite">${chip(promises.label, "In the campaign's own words. A promise, not a fact.")}${srcLinks(promises.sources)}${fixBtn(fid("promises"), shownText(promises.value))}</div><p class="small muted">These are the campaign's own words. We'll compare them with future votes.</p>`}
    </section>

    ${trackRecord(p, fn)}

    ${scoreCard(p)}

    <details class="more panel"><summary>Every source used on this page (${allSources.length})</summary>
      <div class="list" style="border-radius:14px;margin-top:8px">${allSources.map(id => `<a href="${href("s/" + id)}"><span class="src" style="border:0;padding:0"><span class="t t${S[id].tier}">${S[id].tier}</span></span><span class="body"><span class="title small">${esc(S[id].title)}</span><span class="tiny muted">${esc(S[id].publisher)} · ${esc(TIERS[S[id].tier]?.[0] || "")}</span></span>${chev}</a>`).join("")}</div>
    </details>
    ${fixLink(`${CK}/person/${p.id}`, p.name)}
  </div>`;
};


/* ---------- who funds a campaign ---------- */
const usd = n => "$" + Math.round(n).toLocaleString();
const pctOf = (a, t) => t > 0 ? Math.round(100 * a / t) : 0;
function fundingBlock(p, fid) {
  const f = p.funding; if (!f || !f.total) return "";
  const T = f.total;
  const giver = [["people","People giving on their own","#2563EB"],["business","Businesses","#0B3D91"],["committee","Political committees (PACs)","#14B8A6"],["party","Political parties","#64748B"],["self","The candidate's own money","#CBD5E1"]]
    .filter(([k]) => (f.byGiver[k] || 0) > 0);
  const bar = `<div class="fbar" role="img" aria-label="${giver.map(([k,l]) => `${l} ${pctOf(f.byGiver[k],T)}%`).join(", ")}">${giver.map(([k,,c]) => `<span style="width:${Math.max(1,pctOf(f.byGiver[k],T))}%;background:${c}"></span>`).join("")}</div>
    <ul class="plain flegend">${giver.map(([k,l,c]) => `<li><i style="background:${c}"></i><span>${l}</span><b class="num">${usd(f.byGiver[k])}</b><span class="muted num">${pctOf(f.byGiver[k],T)}%</span></li>`).join("")}</ul>`;
  const named = f.sectors.filter(x => !["unstated","nojob","other-job","other-business"].includes(x.id));
  const rest = f.sectors.filter(x => ["unstated","nojob","other-job","other-business"].includes(x.id));
  const maxS = Math.max(1, ...f.sectors.map(x => x.amount));
  const sectorRow = x => `<details class="frow"><summary><span class="fl">${esc(x.label)}</span><span class="fb"><span style="width:${Math.round(100*x.amount/maxS)}%"></span></span><b class="num">${usd(x.amount)}</b><span class="muted num">${pctOf(x.amount,T)}%</span></summary>
      <div class="small stack-sm" style="padding:6px 0 10px">
        <p>${x.fromBusinesses ? `${usd(x.fromBusinesses)} from businesses` : ""}${x.fromBusinesses && x.fromPeople ? " and " : ""}${x.fromPeople ? `${usd(x.fromPeople)} from people who listed a job in this field` : ""}.</p>
        ${x.topBusinesses.length ? `<p class="muted">Businesses in this group: ${x.topBusinesses.map(([n,a]) => `${esc(n)} (${usd(a)})`).join("; ")}</p>` : ""}
      </div></details>`;
  const kinds = {union:"Labor union committee", industry:"Industry or trade group committee", politician:"Another politician's committee", other:"Its name doesn't say who funds it"};
  return `<div class="stack" style="margin-top:6px">
    <h3 class="h3">Where the money came from</h3>
    <p class="small muted">${usd(T)} in reported gifts${f.inKind ? `, including ${usd(f.inKind)} given as goods or services` : ""}, through ${f.through ? fmtDate(f.through) : "the latest report"}. Refunds are subtracted.</p>
    ${bar}
    ${named.length ? `<h3 class="h3" style="margin-top:8px">By industry</h3>
      <p class="small muted">Businesses grouped by their stated line of work, and people by the job they reported. Tap a row to see who's in it.</p>
      <div class="fsectors">${named.map(sectorRow).join("")}</div>
      ${rest.length ? `<details class="more"><summary>Gifts we couldn't group (${usd(rest.reduce((a,x)=>a+x.amount,0))})</summary><div class="fsectors">${rest.map(sectorRow).join("")}</div></details>` : ""}` : ""}
    ${f.committees.length ? `<h3 class="h3" style="margin-top:8px">Political committees (PACs) that gave</h3>
      <p class="small muted">A political committee pools money from people, companies and other committees, then gives it to candidates. Like everyone else, it can give a county candidate up to $1,000 per election. Its name often doesn't say who's behind it; the state's committee records do. <a href="#/money">How this works</a></p>
      <ul class="plain stack-sm">${f.committees.map(c => `<li class="between" style="gap:12px;align-items:flex-start"><span><b>${esc(c.name)}</b><br><span class="tiny muted">${kinds[c.kind] || c.kindLabel}</span></span><b class="num">${usd(c.amount)}</b></li>`).join("")}</ul>
      <a class="small" href="https://dos.elections.myflorida.com/committees/" target="_blank" rel="noopener">Look up any Florida committee's donors (Florida Division of Elections)</a>` : ""}
    ${f.parties.length ? `<p class="small"><b>Political party money:</b> ${f.parties.map(x => `${esc(x.name)} ${usd(x.amount)}`).join("; ")}.</p>` : ""}
    ${f.sharedAddress.length ? `<h3 class="h3" style="margin-top:8px">Companies giving from the same address</h3>
      <p class="small muted">Each company counts as its own donor, so related companies can together give more than the $1,000 one donor can. This is legal. We show it because it tells you who is giving.</p>
      <ul class="plain stack-sm small">${f.sharedAddress.map(c => `<li><b class="num">${usd(c.amount)}</b> from ${c.names.length} companies at one address: ${c.names.map(esc).join(", ")}</li>`).join("")}</ul>` : ""}
    <div class="cite">${srcLinks([f.source])}${f.reportUrl ? `<a class="small" href="${esc(f.reportUrl)}" target="_blank" rel="noopener">Open every report</a>` : ""}${fixBtn(fid("funding"), "Funding breakdown")}</div>
    <p class="tiny muted">The industry groups are ours, made by matching words in each donor's name and reported job, so a few gifts may land in the wrong group. We don't name private individuals who gave; their gifts are in the county's reports. Updated every night from the Supervisor of Elections.</p>
  </div>`;
}

/* ---------- a vote ---------- */
function glassRoll(v) {
  const r = rollOf(v);
  if (!r || (!r.yes?.length && !r.no?.length)) return `<div class="gbox"><span class="gl">How each member voted</span><div class="slips"><span class="slip empty">We don't have each member's vote for this one yet</span></div></div>`;
  const slip = (id, cls) => P[id] ? `<a class="slip ${cls}" href="${href("p/" + id)}">${esc(P[id].name)}</a>` : `<span class="slip ${cls}">${esc(id)}</span>`;
  const box = (label, ids, cls) => `<div class="gbox"><span class="gl">${label}</span><span class="gn num">${ids.length}</span><div class="slips">${ids.length ? ids.map(id => slip(id, cls)).join("") : '<span class="slip empty">No one</span>'}</div></div>`;
  return `<div class="boxes">${box("Voted yes", r.yes || [], "yes")}${box("Voted no", r.no || [], "no")}</div>
    ${(r.absent?.length || r.abstain?.length) ? `<p class="small muted">Not voting: ${[...(r.absent||[]).map(id => esc(P[id]?.name || id) + " (absent)"), ...(r.abstain||[]).map(id => esc(P[id]?.name || id) + " (abstained)")].join(", ")}.</p>` : ""}`;
}

function impactBlock(v, fid) {
  const im = v.impact || {};
  if (!v.impact) return ""; // shown once the fact-checked research for this vote is in
  return `<section class="panel stack" aria-labelledby="eff"><h2 class="h2" id="eff">What this decision does</h2>
    ${im.does ? `<p>${esc(im.does.text)}</p><div class="cite">${srcLinks(im.does.sources)}${fixBtn(fid("does"), im.does.text)}</div>`
      : `<p class="small muted">We're still looking into what this changes on the ground. ${fixBtn(fid("does"), "Effect not written yet")}</p>`}

function citesOf(sid) {
  const out = [];
  C.people.forEach(p => Object.entries(p.facts).forEach(([f, x]) => { const ids = x.sources || (x.versions || []).flatMap(v => v.sources || []); if (ids.includes(sid)) out.push({h: href("p/" + p.id), t: `${p.name}: ${FIELD_NAMES[f] || MONEY_FIELDS[f] || f}`}); }));
  C.votes.forEach(v => { const ids = [...(v.result.sources||[]), ...(v.roll.sources||[]), ...v.facts.flatMap(f => f.sources || [])]; if (ids.includes(sid)) out.push({h: href("v/" + v.id), t: `Vote: ${v.headline}`}); });
  C.races.forEach(r => { if ((r.sources || []).includes(sid)) out.push({h: href("r/" + r.id), t: `Race: ${r.title}`}); });
  return out;
}

views.money = () => policy("How campaign money works", "Who can give to a county commission or school board campaign in Florida, how much, and how to read what we show.", `
  <h2 class="h3">Why it matters</h2>
  <p>County commissioners decide things that are worth a lot of money to some people: what can be built where, which companies get county contracts, what fees and taxes are charged, and how roads, water and trash service are paid for. Many of the businesses and groups affected by those decisions also give to commissioners' campaigns. That is legal and public. Seeing who gives helps you understand whose interests are close to a candidate, and lets you ask good questions. It is not proof that a gift bought a vote.</p>
  <h2 class="h3">The basic rules in Florida</h2>
  <ul class="plain stack-sm">
    <li><b>$1,000 limit.</b> A person, a business or a political committee can give a county or school board candidate up to $1,000 per election.</li>
    <li><b>The primary and general count separately.</b> So a donor can give $1,000 before the August primary and another $1,000 before the November general, unless the candidate is unopposed.</li>
    <li><b>Candidates can spend their own money.</b> There is no limit on what candidates give or lend their own campaigns.</li>
    <li><b>Parties have a bigger limit.</b> A candidate can take up to $50,000 in total from political party committees.</li>
  </ul>
  <p class="small muted">Source: Florida Statutes, <a href="https://www.flsenate.gov/laws/statutes/2022/106.08" target="_blank" rel="noopener">section 106.08</a>.</p>
  <h2 class="h3">Businesses</h2>
  <p>Companies can give to candidates, and each company counts as its own donor. One owner with several companies (often one company per property or project) can give $1,000 from each of them. When we see three or more companies giving from the same street address, we point it out so you can see who is really giving.</p>
  <h2 class="h3">Political committees (PACs)</h2>
  <p>A political committee collects money from people, companies, unions and other committees, then spends it on elections, including gifts to candidates. When a committee gives directly to a candidate, the same $1,000-per-election limit applies.</p>
  <p>Committee names can be vague ("Florida Prosper", "Building Florida's Future"). The name doesn't tell you who funds it. Every Florida committee files reports listing its own donors with the <a href="https://dos.elections.myflorida.com/committees/" target="_blank" rel="noopener">Florida Division of Elections</a>. Where a committee's name plainly says who it represents, such as a realtors' group or a union local, we say so. Otherwise we label it "its name doesn't say who funds it."</p>
  <p>Some groups also spend money on ads that support or attack candidates without giving to the campaign. That spending isn't in the candidate's own reports, so it isn't in our totals yet.</p>
  <h2 class="h3">How we group donors by industry</h2>
  <p>Florida's reports list each donor's name, city and, for many gifts, an occupation or type of business. We group businesses by the line of work they reported, then by words in their name. We group people by the job they reported. For example, a company that lists "Land Development", or whose name includes "Realty", goes under real estate and land development.</p>
  <p>This grouping is ours, not the county's, and some gifts will land in the wrong group. Every group can be opened to see the businesses in it, and every candidate's page links to the full reports. If you spot a mistake, use the report button and we'll fix it.</p>
  <h2 class="h3">Private donors</h2>
  <p>Individual donors' names and addresses are public record, and you can see them in the county's reports. We don't repeat them. We show only the job they reported, so you can see which fields a campaign's money comes from without singling out private people. Businesses, committees and parties are named.</p>
  <h2 class="h3">Where the numbers come from</h2>
  <p>Every candidate files itemized reports with their county Supervisor of Elections. We read those reports every night. Totals include gifts of goods or services (called in-kind), and subtract refunds. Money a candidate lent or gave themselves is shown separately.</p>
`);

views.standards = () => policy("Our standards", "How we decide what goes on this site, and what we do when we get something wrong.", `
  <h2 class="h3">We don't take sides</h2>
  <p>Glass Ballot does not endorse, rate or rank candidates, parties or ballot questions. We list candidates alphabetically. We describe every candidate using the same kinds of facts, and we write about every vote the same way, whoever voted for it.</p>
  <h2 class="h3">Where facts come from</h2>
  <p>We use government records first: meeting minutes and votes, campaign finance reports, election results and official county pages. We also use news reports, nonpartisan research groups and the candidates' own websites, and we label each one so you can tell the difference. Something a candidate says about themselves is shown as their claim, not as a fact.</p>
  <h2 class="h3">How we label facts</h2>
  <ul><li><b>Verified</b> means a government record says it and a second, independent source agrees.</li><li><b>Government record</b> means it comes from a government record we haven't been able to check against a second source.</li><li><b>Not yet confirmed</b> means it comes only from news, research groups or the candidate.</li><li><b>Sources disagree</b> means our sources say different things. We show each version and the government record first.</li><li><b>Not found yet</b> means we looked and couldn't find it.</li></ul>
  <p>Two news outlets owned by the same company count as one source.</p>
  <h2 class="h3">How we write about votes</h2>
  <p>Each vote page has our plain-English summary, the name of the meeting, the agenda item number, a link to the county's official record, the exact motion when the record includes it, and the official wording copied from the county's agenda. If our summary and the record ever differ, the record is right and we will fix the summary.</p>
  <h2 class="h3">Money and connections</h2>
  <p>We show how much each candidate has raised, using the reports they file with their county Supervisor of Elections. When someone who gave money to a commissioner later had business before the commission, we list that connection, with the dates. A donation is legal and public. Listing a connection does not mean anyone did anything wrong, and we never say or suggest that it does.</p>
  <h2 class="h3">The Pocket or Public score</h2>
  <p>This is a measure we're building to show, from public records only, how often an official's votes may have benefited themselves or their donors rather than the public. It never uses party or our opinion of whether a vote was good. Its parts are conflicts of interest, money and timing, promises kept, and showing up. We only show an overall score once we have enough data, and the formula is public on GitHub.</p>
  <h2 class="h3">Corrections</h2>
  <p>Anyone can report a mistake using the pencil button next to any fact. We need a link to a record or published report so we can check it. A person reviews every report. If we change a fact, we list the date, what it said before and what it says now on our <a href="#/corrections">changes and corrections page</a>. We do not quietly edit facts. Candidates and officials can use the same form, or email us at glassballotinfo@gmail.com.</p>
  <h2 class="h3">Independence</h2>
  <p>Glass Ballot is free to use. We do not accept money from candidates, campaigns, political parties, political committees or anyone appearing on the ballot, and we do not run political ads. If we ever accept funding from anyone else, we will list it on this page.</p>
  <h2 class="h3">Automation</h2>
  <p>Software collects public records each night and updates numbers like vote counts and campaign totals. Software also helps us find and organize records. A person writes and reviews every plain-English summary before it appears as a summary. When something is waiting for review, the page says so.</p>`);

  <p>By using glassballot.org you agree to these terms. If you don't agree, please don't use the site.</p>

  <h2 class="h3">Links to other sites</h2>

  <h2 class="h3">Reports you send us</h2>
  <p>When you report a mistake, you agree that what you send is truthful to the best of your knowledge, and that we may use it to review and correct the site. Don't send anything that is abusive, misleading, or that you don't have the right to share. We may ignore or delete reports that are spam, off topic or abusive. We don't publish your name or email address.</p>
  <h2 class="h3">Using our information</h2>
  <p>The facts on this site come from public records. You are welcome to share and quote them. Please link back to the page you used so others can see the sources. Our site design, logo and written summaries belong to Glass Ballot. Photos belong to their owners, listed with each source.</p>
  <h2 class="h3">No warranty</h2>
  <p>The site is provided "as is," without warranties of any kind. To the fullest extent the law allows, Glass Ballot is not liable for any loss or damage that comes from using the site or relying on its information.</p>
  <h2 class="h3">Changes and governing law</h2>
  <p>We may update these terms. The date at the top shows the latest version. These terms are governed by the laws of the State of Florida.</p>
  <h2 class="h3">Contact</h2>
  <p>glassballotinfo@gmail.com</p>`);

views.privacy = () => policy("Privacy policy", "Short version: we don't track you, we don't sell anything, and your choices stay on your device.", `
  <h2 class="h3">What we don't do</h2>
  <ul><li>We don't use advertising or tracking cookies.</li><li>We don't run analytics that follow you around the web.</li><li>We don't sell or rent information about anyone.</li></ul>
  <h2 class="h3">What stays on your device</h2>
  <p>Your county, your district, your text-size setting and the list of choices you mark are saved in your own browser so the site remembers them next time. We never receive them. You can clear them by clearing your browser's site data.</p>
  <h2 class="h3">If you report a mistake</h2>
  <p>The report form sends us what you type, the page you were on, and your email address if you choose to give it. We use this only to review the report and, if needed, to ask you a question. We don't publish your name or email address, and we don't add you to any mailing list. Reports are stored by our web host, Netlify, and copies come to our email inbox.</p>
  <h2 class="h3">Services that help run the site</h2>
  <ul><li><b>Netlify</b> hosts the site and the report form, and keeps standard server logs, such as IP addresses, for security.</li><li><b>Google reCAPTCHA</b> on the report form blocks spam. Google's privacy policy and terms apply to it.</li><li><b>Google Fonts</b> provides the site's typefaces, so your browser contacts Google to load them.</li><li><b>Candidate photos</b> load from county and election office websites, so your browser contacts those sites when a photo appears.</li></ul>
  <h2 class="h3">Children</h2>
  <p>This site is meant for voters and isn't directed at children under 13. We don't knowingly collect information from them.</p>
  <h2 class="h3">Questions</h2>
