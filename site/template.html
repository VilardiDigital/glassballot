const SCORE_PARTS = [
  ["conflict_handling","Conflicts of interest","When they or a donor had something to gain, did they say so and sit out the vote?","We need their state financial disclosure forms first."],
  ["money_timing","Money and timing","How much of their campaign money did NOT come from a donor within 90 days of a vote about that donor.","Needs their campaign reports matched to their votes."],
  ["promise_match","Promises kept","Did their votes match what they said they would do?","Needs their campaign promises matched to votes."],
  ["openness","Showing up","Do they file disclosure forms on time and come to meetings?","Needs filing dates and meeting attendance."]
];
function scoreCard(p) {
  const s = p.score; if (!s) return "";
  const parts = SCORE_PARTS.map(([k, name, q, need]) => { const val = s.parts[k];
    return `<div class="part"><div><div style="font-weight:600">${name}</div><div class="small muted">${val == null ? need : q}</div></div><div class="num" style="font-family:var(--head);font-weight:800;color:var(--civic)">${val == null ? '<span class="tiny muted" style="font-family:var(--body);font-weight:500">Not enough data</span>' : val}</div></div>`; }).join("");
  return `<details class="more panel"><summary>Pocket or Public: who benefits from their votes? (in progress)</summary>
    <p class="small muted" style="margin:8px 0">A score from 0 to 100 built only from public records, never from party. We only show an overall number once there's enough data. <a href="#/standards">How it works</a></p>
    <div>${parts}</div></details>`;
}

function glance(p) {
  const v = f => { const x = p.facts[f]; return x && x.label !== "unknown" ? (x.value != null ? shownText(x.value) : "Sources disagree") : null; };
  const items = [["Party", partyOf(p) || (p.nonpartisan ? "Nonpartisan race" : null)], ["In office since", v("inOfficeSince")], ["Money raised", v("raised")],
    ["Votes cast", p.tally ? (p.tally.aye + p.tally.nay + p.tally.abstain).toLocaleString() : null], ["Attendance", v("attendance")]].filter(([, x]) => x);
  if (!items.length) return "";
  return `<section aria-label="At a glance"><div class="glance">${items.map(([k, x]) => `<div><span class="k">${k}</span><span class="v">${esc(String(x).length > 90 ? String(x).slice(0, 88) + "…" : x)}</span></div>`).join("")}</div></section>`;
}

const LINK_KINDS = {official:"Official county page", campaign:"Campaign website", facebook:"Facebook", x:"X (Twitter)", instagram:"Instagram", linkedin:"LinkedIn", youtube:"YouTube", tiktok:"TikTok"};
function linksBlock(p) {
  const ls = (p.links || []).slice().sort((a,b) => Object.keys(LINK_KINDS).indexOf(a.kind) - Object.keys(LINK_KINDS).indexOf(b.kind));
  if (!ls.length) return `<p class="small muted">We haven't confirmed a website or social media account for ${esc(firstName(p))} yet. ${fixBtn(`${CK}/person/${p.id}/links`, "No links on file")}</p>`;
  return `<div class="row" style="gap:8px">${ls.map(l => `<a class="btn" style="min-height:44px;padding:0 14px;font-size:15px" href="${esc(l.url)}" target="_blank" rel="noopener nofollow">${esc(LINK_KINDS[l.kind] || "Link")}</a>`).join("")}${fixBtn(`${CK}/person/${p.id}/links`, ls.map(l => l.url).join(" "))}</div>
    <p class="tiny muted">We only list accounts we could confirm through their campaign website, the county or election filings.</p>`;
}

const DIG_PARTS = [["electionHistory","Election history","How they won (or got) the seat each time. Official results where we could open them."],["promises","Past campaign promises","What they said when running before, in their own words or as reported. A promise, not a fact."],["keyPositions","Positions taken in office","Stands they took on the record: votes, motions and public statements."],["conflicts","Ethics and conduct records","Ethics complaints, opinions or concerns raised in public, with their response when we have it. None of these is a finding of wrongdoing unless it says so."],["checked","What we searched and found nothing","Records we checked for this person that turned up no ethics findings or recusals."]];
function trackRecord(p, fn) {
  const d = p.dig || {};
  const parts = DIG_PARTS.filter(([k]) => (d[k] || []).length);
  if (!parts.length) return "";
  const li = k => (r, i) => `<li><span>${esc(r.text)}</span><div class="cite">${srcLinks([r.source])}${fixBtn(`${CK}/person/${p.id}/${k}-${i}`, r.text)}</div></li>`;
  return `${parts.map(([k, title, note]) => { const items = d[k].map((r, i) => li(k)(r, i));
    return `<div class="stack-sm"><h3 class="h3">${title}</h3><p class="tiny muted">${note}</p>
      <ul class="plain stack-sm">${items.slice(0, 3).join("")}</ul>${items.length > 3 ? `<details class="more"><summary>Show ${items.length - 3} more</summary><ul class="plain stack-sm">${items.slice(3).join("")}</ul></details>` : ""}</div>`; }).join("")}
    <p class="tiny muted">Each line links to the record or report it came from. If something is wrong or missing, tell us.</p>`;
}

/* Drawers: a section that starts closed on phones, with a one-line preview so you know what's inside */
const openD = new Set();
const WIDE = () => window.matchMedia("(min-width:960px)").matches;
const drawer = (key, id, title, preview, body, cls = "panel") => `<details class="drawer ${cls}" id="${id}" data-d="${esc(key)}"${openD.has(key) || WIDE() ? " open" : ""}><summary><span class="dh"><h2 class="h2">${title}</h2>${preview ? `<span class="small muted">${preview}</span>` : ""}</span><span class="dchev" aria-hidden="true"></span></summary><div class="dbody stack">${body}</div></details>`;
document.addEventListener("toggle", e => { const d = e.target; if (d.matches && d.matches("details.drawer")) { if (d.open) openD.add(d.dataset.d); else openD.delete(d.dataset.d); } }, true);
const firstSentence = t => { const x = String(t || "").split(/(?<=[.!?])\s/)[0]; return x.length > 110 ? x.slice(0, 107).replace(/\s\S*$/, "") + "…" : x; };
const topN = (items, n, render, more) => `${items.slice(0, n).map(render).join("")}${items.length > n ? `<details class="more"><summary>${more(items.length - n)}</summary>${items.slice(n).map(render).join("")}</details>` : ""}`;

function shortVersion(p, fn, has) {
  const fv = f => { const x = p.facts[f]; return x && x.label !== "unknown" && x.value != null ? shownText(x.value) : null; };
  const lines = [];
  if (p.tally) { const n = p.tally.aye + p.tally.nay + p.tally.abstain; lines.push(["hv", "Votes", `${n.toLocaleString()} votes cast: ${p.tally.aye.toLocaleString()} yes, ${p.tally.nay.toLocaleString()} no${p.tally.absent ? `, missed ${p.tally.absent.toLocaleString()}` : ""}`]); }
  else if (p.status !== "incumbent") lines.push(["hv", "Votes", `Hasn't served on this board yet, so no votes to show`]);
  const f = p.funding;
  if (f && f.total) { const top = f.sectors.find(x => !["unstated","nojob","other-job","other-business"].includes(x.id));
    lines.push(["mo", "Money", `Raised ${usd(f.total)}${f.cycle && f.cycle !== "2026" ? ` for the ${esc(f.cycle)} race` : ""}${top ? `. Biggest industry: ${esc(top.label.toLowerCase())} (${pctTxt(top.amount, f.total)})` : ""}`]); }
  else if (fv("raised")) lines.push(["mo", "Money", esc(firstSentence(fv("raised")))]);
  if (has.cx) lines.push(["cx", "Donor ties", `${has.cx} donor${has.cx > 1 ? "s" : ""} also had business before the commission`]);
  const att = fv("attendance"); if (att) lines.push(["ab", "Attendance", esc(firstSentence(att))]);
  const d = p.dig || {};
  if (has.promises) lines.push(["pr", "Promises", "Has a list of priorities for this campaign"]);
  else if ((d.promises || []).length) lines.push(["tr", "Promises", `${d.promises.length} past campaign promise${d.promises.length > 1 ? "s" : ""} on record`]);
  if ((d.conflicts || []).length) lines.push(["tr", "Ethics", `${d.conflicts.length} ethics or conduct record${d.conflicts.length > 1 ? "s" : ""} to read`]);
  else if ((d.checked || []).length) lines.push(["tr", "Ethics", "No ethics findings in the records we searched"]);
  if (!lines.length) return "";
  return `<section class="short panel" aria-labelledby="sv"><h2 class="h3" id="sv">The short version</h2>
    <ul class="plain">${lines.map(([id, k, t]) => `<li><a href="#${id}" data-jump="${id}"><span class="k">${k}</span><span class="t">${t}</span>${chev}</a></li>`).join("")}</ul></section>`;
}

views.person = id => {
  const p = P[id]; if (!p) return notFound();
  const race = p.race ? R[p.race] : null;
  const rivals = race ? race.people.filter(x => x !== p.id).map(x => P[x]).filter(Boolean) : [];
  const shown = Object.keys(FIELD_NAMES).filter(f => f !== "party" && p.facts[f] && (p.facts[f].label !== "unknown" || p.required.includes(f)));
  const moneyShown = Object.keys(MONEY_FIELDS).filter(f => p.facts[f] && (p.facts[f].label !== "unknown" || (f === "raised" && !p.funding)));
  const cnx = (p.connections || []).slice().sort((a,b) => (b.inWindow - a.inWindow) || (b.amount - a.amount));
  const promises = p.facts.promises;
  const hasPromises = promises && promises.label !== "unknown";
  const myVotes = p.votes.map(x => ({...x, v: V[x.vote]})).filter(x => x.v);
  const allSources = [...new Set([...Object.values(p.facts).flatMap(f => f.sources || (f.versions || []).flatMap(v => v.sources || [])), ...Object.values(p.dig || {}).flat().map(r => r.source)])].filter(id => S[id]);
  const fid = f => `${CK}/person/${p.id}/${f}`;
  const fn = esc(firstName(p));
  const dk = s => p.id + "/" + s;
  const d = p.dig || {};
  const trCount = DIG_PARTS.reduce((a, [k]) => a + (d[k] || []).length, 0);
  const jumps = [["hv","Votes"],["mo","Money"],cnx.length ? ["cx","Donor ties"] : null,["pr","Promises"],trCount ? ["tr","Track record"] : null,["ab","About"]].filter(Boolean);
  const nVotes = myVotes.length;
  const voteBody = `${p.tally ? `<div class="stats">${[["Yes",p.tally.aye],["No",p.tally.nay],["Absent",p.tally.absent],["Abstained",p.tally.abstain]].map(([k,n]) => `<div class="stat"><b>${n.toLocaleString()}</b><span class="small muted">${k}</span></div>`).join("")}</div>
        <p class="small muted">From the county's official meeting records since ${esc(C.legistarScope || "this term began")}. Most items pass with everyone agreeing, so below are the votes where commissioners split, plus a few big decisions.</p>` : ""}
      ${myVotes.length ? `<div class="list">${myVotes.slice(0, showAll.has(p.id) ? 999 : 5).map(({how, v}) => `<a href="${href("v/" + v.id)}"><span class="vote ${how}">${how.toUpperCase()}</span><span class="body"><span class="title">${esc(v.headline)}</span><span class="tiny muted">${esc(voteDate(v))}${v.result.value ? " · " + esc(v.result.value) : ""}</span></span>${chev}</a>`).join("")}</div>`
        : `<p class="small muted">${p.status !== "incumbent" ? `${fn} hasn't served on this board, so there are no votes to show.` : "We haven't loaded individual votes for this person yet."}</p>`}
      ${myVotes.length > 5 && !showAll.has(p.id) ? `<button class="btn" type="button" data-more="${p.id}">Show all ${myVotes.length} votes</button>` : ""}`;
  const f = p.funding;
  const moneyPrev = f && f.total ? `${usd(f.total)} in itemized gifts${f.cycle && f.cycle !== "2026" ? `, from the ${esc(f.cycle)} campaign` : ""}` : (moneyShown.length ? "What's on file so far" : "No reports on file yet");
  const promPrev = hasPromises ? "In the campaign's own words" : ((d.promises || []).length ? "None listed this time; past promises are in the track record" : "None found yet");
  const aboutPrev = [p.facts.inOfficeSince && p.facts.inOfficeSince.value ? `In office since ${esc(shownText(p.facts.inOfficeSince.value).replace(/^Elected\s+/i, "").replace(/^since\s+/i, ""))}` : "", (p.links || []).length ? "website and social media" : ""].filter(Boolean).join(", ") || "Background, work and filings";
  return `<div class="stack-lg view person-v">
    <a class="back" href="${race ? href("r/" + race.id) : href("officials")}">‹ ${race ? esc(race.title) : `${esc(cname(CK))} commissioners`}</a>
    <section class="who" style="gap:16px;align-items:flex-end">
      ${face(p, "lg")}
      <div class="stack-sm" style="min-width:0">
        <h1 class="h1">${esc(p.name)}</h1>
        <p class="lede" style="font-size:17px">${esc(p.office)}${p.district ? `, District ${esc(p.district)}` : ""}${partyOf(p) ? ` · ${esc(partyOf(p))}` : ""}</p>
        <div class="row">${race ? `<a class="pill blue" href="${href("r/" + race.id)}" style="text-decoration:none">On your Nov 3 ballot</a>` : ""}<span class="pill">${statusText(p)}</span>${C.county.auto ? '<span class="pill">Early version</span>' : ""}</div>
      </div>
    </section>
    ${rivals.length ? `<a class="vs" href="${href("r/" + race.id)}"><span class="small muted">Running against</span><b>${rivals.map(r => esc(r.name)).join(", ")}</b><span class="small">Compare</span>${chev}</a>` : ""}
    ${shortVersion(p, fn, {cx: cnx.length, promises: hasPromises})}
    <nav class="jumpbar" aria-label="Sections on this page">${jumps.map(([id, t]) => `<a href="#${id}" data-jump="${id}">${t}</a>`).join("")}</nav>

    ${drawer(dk("hv"), "hv", `How ${fn} has voted`, nVotes ? `${nVotes} vote${nVotes > 1 ? "s" : ""} explained in plain English` : (p.tally ? "Totals from the county's records" : "No votes on this board"), voteBody, "plain")}

    ${drawer(dk("mo"), "mo", "Who is paying for the campaign", moneyPrev, `
      ${f && f.total ? "" : `<dl class="facts">${moneyShown.map(x => `<div class="fact"><dt>${MONEY_FIELDS[x]}</dt><dd>${factBlock(p.facts[x], fid(x), {unknownText: "No campaign finance reports on file yet."})}</dd></div>`).join("")}</dl>`}
      ${fundingBlock(p, fid)}
      ${f && f.total && moneyShown.filter(x => x !== "raised").length ? `<details class="more"><summary>More money details</summary><dl class="facts">${moneyShown.filter(x => x !== "raised").map(x => `<div class="fact"><dt>${MONEY_FIELDS[x]}</dt><dd>${factBlock(p.facts[x], fid(x))}</dd></div>`).join("")}</dl></details>` : ""}
      ${C.county.financeUrl ? `<p class="small muted">Every donation, with the donor's name, date and amount, is in the <a href="${esc(C.county.financeUrl)}" target="_blank" rel="noopener">Supervisor of Elections campaign reports</a>.</p>` : ""}`)}

    ${cnx.length ? drawer(dk("cx"), "cx", "Donors who had business before the commission", `${cnx.length} donor${cnx.length > 1 ? "s" : ""}`, `
      <p class="small muted">Giving to a campaign is legal and public. We list these so you can see the connection. It is not a claim that anyone did something wrong.</p>
      ${cnx.map((c, i) => `<article class="stack-sm cx">
        <p><b>${esc(c.donor)}</b> gave <span class="num">$${c.amount.toLocaleString()}</span>, most recently on ${fmtDate(c.date)}.${c.inWindow ? " That was within 90 days of a vote about them." : ""}</p>
        ${c.votes.length ? `<ul class="plain small">${c.votes.map(v => `<li>${esc(v)}</li>`).join("")}</ul>` : ""}
        ${c.note ? `<p class="small muted">${esc(c.note)}</p>` : ""}
        <div class="cite">${chip(c.label)}${srcLinks(c.sources)}${fixBtn(`${CK}/person/${p.id}/connection-${i}`, `${c.donor} gave $${c.amount}`)}</div>
      </article>`).join("")}`) : ""}

    ${drawer(dk("pr"), "pr", `What ${fn} says they'll do`, promPrev, !hasPromises ? `<p class="small muted">${(d.promises || []).length ? `We haven't found a list of priorities for this campaign yet. What ${fn} promised in past campaigns is under <a href="#tr" data-jump="tr">track record</a>.` : "We haven't found a list of priorities from this campaign yet."} ${fixBtn(fid("promises"), "None on file")}</p>` : `${valueText(promises.value)}<div class="cite">${chip(promises.label, "In the campaign's own words. A promise, not a fact.")}${srcLinks(promises.sources)}${fixBtn(fid("promises"), shownText(promises.value))}</div><p class="small muted">These are the campaign's own words, not facts. We'll compare them with future votes.</p>`)}

    ${trCount ? drawer(dk("tr"), "tr", `${fn}'s track record`, (DIG_PARTS.filter(([k]) => k !== "checked" && (d[k] || []).length).map(([k, t]) => `${d[k].length} ${t.toLowerCase().replace(/ records$/, "")}`).join(" · ") || "Records we searched"), trackRecord(p, fn)) : ""}

    ${drawer(dk("ab"), "ab", `About ${fn}`, aboutPrev, `
      <dl class="facts">${p.facts.party && !p.nonpartisan ? `<div class="fact"><dt>Party</dt><dd>${factBlock(p.facts.party, fid("party"))}</dd></div>` : ""}${shown.map(x => `<div class="fact"><dt>${FIELD_NAMES[x]}</dt><dd>${factBlock(p.facts[x], fid(x))}</dd></div>`).join("")}</dl>
      <h3 class="h3">Website and social media</h3>${linksBlock(p)}`)}

    <details class="more panel"><summary>Every source used on this page (${allSources.length})</summary>
      <div class="list" style="border-radius:14px;margin-top:8px">${allSources.map(id => `<a href="${href("s/" + id)}"><span class="src" style="border:0;padding:0"><span class="t t${S[id].tier}">${S[id].tier}</span></span><span class="body"><span class="title small">${esc(S[id].title)}</span><span class="tiny muted">${esc(S[id].publisher)} · ${esc(TIERS[S[id].tier]?.[0] || "")}</span></span>${chev}</a>`).join("")}</div>
    </details>
    ${fixLink(`${CK}/person/${p.id}`, p.name)}
  </div>`;
};


/* ---------- who funds a campaign ---------- */
const usd = n => "$" + Math.round(n).toLocaleString();
const pctOf = (a, t) => t > 0 ? Math.round(100 * a / t) : 0;
const pctTxt = (a, t) => { const n = t > 0 ? 100 * a / t : 0; return n > 0 && n < 1 ? "<1%" : Math.round(n) + "%"; };
function fundingBlock(p, fid) {
  const f = p.funding; if (!f || !f.total) return "";
  const T = f.total;
  const giver = [["people","People giving on their own","#2563EB"],["business","Businesses","#0B3D91"],["committee","Political committees (PACs)","#14B8A6"],["party","Political parties","#64748B"],["self","The candidate's own money","#CBD5E1"]]
    .filter(([k]) => (f.byGiver[k] || 0) > 0);
  const bar = `<div class="fbar" role="img" aria-label="${giver.map(([k,l]) => `${l} ${pctOf(f.byGiver[k],T)}%`).join(", ")}">${giver.map(([k,,c]) => `<span style="width:${Math.max(1,pctOf(f.byGiver[k],T))}%;background:${c}"></span>`).join("")}</div>
    <ul class="plain flegend">${giver.map(([k,l,c]) => `<li><i style="background:${c}"></i><span>${l}</span><b class="num">${usd(f.byGiver[k])}</b><span class="muted num">${pctTxt(f.byGiver[k],T)}</span></li>`).join("")}</ul>`;
  const named = f.sectors.filter(x => !["unstated","nojob","other-job","other-business"].includes(x.id));
  const rest = f.sectors.filter(x => ["unstated","nojob","other-job","other-business"].includes(x.id));
  const maxS = Math.max(1, ...f.sectors.map(x => x.amount));
  const sectorRow = x => `<details class="frow"><summary><span class="fl">${esc(x.label)}</span><span class="fb"><span style="width:${Math.round(100*x.amount/maxS)}%"></span></span><b class="num">${usd(x.amount)}</b><span class="muted num">${pctTxt(x.amount,T)}</span></summary>
      <div class="small stack-sm" style="padding:6px 0 10px">
        <p>${x.fromBusinesses ? `${usd(x.fromBusinesses)} from businesses` : ""}${x.fromBusinesses && x.fromPeople ? " and " : ""}${x.fromPeople ? `${usd(x.fromPeople)} from people who listed a job in this field` : ""}.</p>
        ${x.topBusinesses.length ? `<p class="muted">Businesses in this group: ${x.topBusinesses.map(([n,a]) => `${esc(n)} (${usd(a)})`).join("; ")}</p>` : ""}
      </div></details>`;
  const kinds = {publicsafety:"Firefighters' or police officers' group committee", union:"Labor union committee", industry:"Industry or trade group committee", politician:"Another politician's committee", other:"Its name doesn't say who funds it"};
  return `<div class="stack" style="margin-top:6px">
    <h3 class="h3">Where the money came from</h3>
    ${f.cycle && f.cycle !== "2026" ? `<p class="small"><b>${esc(firstName(p))} isn't on the ballot this year.</b> This is from their most recent campaign account, filed in the county's ${esc(f.cycle)} election cycle${f.office ? ` (${esc(f.office)})` : ""}.</p>` : ""}
    <p class="small muted">${usd(T)} in itemized gifts${f.inKind ? `, including ${usd(f.inKind)} given as goods or services` : ""}, through ${f.through ? fmtDate(f.through) : "the latest report"}. Refunds are subtracted.</p>
    ${f.prior ? `<p class="small">Plus <b>${usd(f.prior)}</b> raised before this campaign switched to this race. Those gifts are itemized in state records, not the county's, so they aren't in the breakdown below.</p>` : ""}
    ${bar}
    ${named.length ? `<h3 class="h3" style="margin-top:8px">By industry</h3>
      <p class="small muted">Tap a row to see who's in it.</p>
      <div class="fsectors">${named.slice(0, 3).map(sectorRow).join("")}</div>
      ${named.length > 3 ? `<details class="more"><summary>Show ${named.length - 3} more industries</summary><div class="fsectors">${named.slice(3).map(sectorRow).join("")}</div></details>` : ""}
      ${rest.length ? `<details class="more"><summary>Gifts we couldn't group (${usd(rest.reduce((a,x)=>a+x.amount,0))})</summary><div class="fsectors">${rest.map(sectorRow).join("")}</div></details>` : ""}` : ""}
    ${f.committees.length ? `<h3 class="h3" style="margin-top:8px">Political committees (PACs) that gave</h3>
      <details class="more"><summary>What's a PAC?</summary><p class="small muted">A political committee pools money from people, companies and other committees, then gives it to candidates. Like everyone else, it can give a county candidate up to $1,000 per election. Its name often doesn't say who's behind it, and the county's reports cut long names short; the state's committee records list each committee's own donors. <a href="#/money">How this works</a></p></details>
      ${(() => { const li = c => `<li class="fcom"><span><b>${esc(c.name)}</b><br><span class="tiny muted">${kinds[c.kind] || c.kindLabel}</span></span><b class="num">${usd(c.amount)}</b></li>`;
        return `<ul class="plain stack-sm">${f.committees.slice(0, 3).map(li).join("")}</ul>${f.committees.length > 3 ? `<details class="more"><summary>Show all ${f.committees.length} committees (${usd(f.committees.reduce((a, c) => a + c.amount, 0))} in total)</summary><ul class="plain stack-sm" style="margin-top:8px">${f.committees.slice(3).map(li).join("")}</ul></details>` : ""}`; })()}

      <a class="small" href="https://dos.elections.myflorida.com/committees/" target="_blank" rel="noopener">Look up any Florida committee's donors (Florida Division of Elections)</a>` : ""}
    ${f.parties.length ? `<p class="small"><b>Political party money:</b> ${f.parties.map(x => `${esc(x.name)} ${usd(x.amount)}`).join("; ")}.</p>` : ""}
    ${f.sharedAddress.length ? `<h3 class="h3" style="margin-top:8px">Companies giving from the same address</h3>
      <p class="small muted">Related companies can each give $1,000, so together they can give more than one donor could. This is legal. We show it because it tells you who is giving.</p>
      <ul class="plain stack-sm small">${f.sharedAddress.map(c => `<li><b class="num">${usd(c.amount)}</b> from ${c.names.length} companies at one address: ${c.names.map(esc).join(", ")}</li>`).join("")}</ul>` : ""}
    <div class="cite">${srcLinks([f.source])}${f.reportUrl ? `<a class="small" href="${esc(f.reportUrl)}" target="_blank" rel="noopener">Open every report</a>` : ""}${fixBtn(fid("funding"), "Funding breakdown")}</div>
    <p class="tiny muted">The industry groups are ours, made by matching words in each donor's name and reported job, so a few gifts may land in the wrong group. We don't name private individuals who gave; their gifts are in the county's reports. Updated every night from the Supervisor of Elections.</p>
  </div>`;
}

/* ---------- a vote ---------- */
function glassRoll(v) {
  const r = rollOf(v);
  if (!r || (!r.yes?.length && !r.no?.length)) return `<div class="gbox"><span class="gl">How each member voted</span><div class="slips"><span class="slip empty">We don't have each member's vote for this one yet</span></div></div>`;
  const slip = (id, cls) => P[id] ? `<a class="slip ${cls}" href="${href("p/" + id)}">${esc(P[id].name)}</a>` : `<span class="slip ${cls}">${esc(id)}</span>`;
  const box = (label, ids, cls) => `<div class="gbox"><span class="gl">${label}</span><span class="gn num">${ids.length}</span><div class="slips">${ids.length ? ids.map(id => slip(id, cls)).join("") : '<span class="slip empty">No one</span>'}</div></div>`;
  return `<div class="boxes">${box("Voted yes", r.yes || [], "yes")}${box("Voted no", r.no || [], "no")}</div>
    ${(r.absent?.length || r.abstain?.length) ? `<p class="small muted">Not voting: ${[...(r.absent||[]).map(id => esc(P[id]?.name || id) + " (absent)"), ...(r.abstain||[]).map(id => esc(P[id]?.name || id) + " (abstained)")].join(", ")}.</p>` : ""}`;
}

function publicBlock(v, fid) {
  const pc = v.public; if (!pc) return "";
  const n = pc.speakers;
  let line;
  if (n === 0) line = "No one from the public spoke on this item." + (pc.applicant ? " The applicant's team spoke." : "");
  else if (n === "some") line = "The board took public comment on this item. The county's minutes don't record how many people spoke or what they said; the meeting video does.";
  else if (typeof n === "number") {
    const sides = [[pc.for, "spoke in support"], [pc.against, "spoke against it or raised concerns"], [pc.other, "spoke without the minutes recording a side"]].filter(([k]) => k > 0);
    line = sides.length === 1 ? `${n} ${n === 1 ? "person" : "people"} ${sides[0][1].replace(/^spoke /, "spoke ").replace(/^spoke against it or raised concerns$/, "spoke against it or raised concerns")}.` : `${n} people spoke: ${sides.map(([k, t]) => `${k} ${t}`).join(", ")}.`;
    line +=  `${pc.cities.length ? ` Speakers gave their city as ${pc.cities.join(", ")}.` : ""}${pc.groups ? " At least one speaker spoke for a group of people in the room." : ""}${pc.applicant ? ` The applicant's team also spoke (not counted here).` : ""}`;
  }
  return `<section class="panel stack-sm" aria-labelledby="pub"><h2 class="h3" id="pub">What the public said</h2>
    ${line ? `<p>${esc(line)}</p>` : ""}
    ${pc.mail ? `<p>${esc(pc.mail)}</p>` : ""}
    <p class="tiny muted">From the clerk's official minutes. Public comment isn't a poll: the people who come to speak aren't a sample of the county, and applicants and organized groups often bring supporters. We don't name members of the public. ${fixBtn(fid("public"), line || pc.mail || "")}</p>
  </section>`;
}

function impactBlock(v, fid) {
  const im = v.impact || {};
  if (!v.impact) return ""; // shown once the fact-checked research for this vote is in
  return `<section class="panel stack" aria-labelledby="eff"><h2 class="h2" id="eff">What this decision does</h2>
    ${im.does ? `<p>${esc(im.does.text)}</p><div class="cite">${srcLinks(im.does.sources)}${fixBtn(fid("does"), im.does.text)}</div>`
      : `<p class="small muted">We're still looking into what this changes on the ground. ${fixBtn(fid("does"), "Effect not written yet")}</p>`}
    <h3 class="h3" style="margin-top:4px">What happened after</h3>
    ${(im.after || []).length ? `<ol class="plain stack-sm">${im.after.map((a, i) => `<li><span class="kicker" style="font-size:13px">${a.date ? esc(fmtDate(a.date)) : ""}</span><br>${esc(a.text)}<div class="cite">${srcLinks(a.sources)}${fixBtn(fid("after-" + i), a.text)}</div></li>`).join("")}</ol>`
      : `<p class="small muted">We haven't found any reported follow-up yet. If you know of one, ${fixBtn(fid("after"), "No follow-up listed")}</p>`}
    <p class="tiny muted">We report what happened and who said so. We don't say whether a decision was good or bad; that's yours to judge.</p>
  </section>`;
}

views.vote_item = id => {
  const v = V[id]; if (!v) return notFound();
  const others = C.votes.filter(x => x.topic === v.topic && x.id !== v.id).slice(0, 4);
  const allSources = [...new Set([...(v.result.sources||[]), ...(v.roll.sources||[]), ...v.facts.flatMap(f => f.sources || []), ...(v.impact?.does?.sources || []), ...(v.impact?.after || []).flatMap(a => a.sources)])].filter(id => S[id]);
  const fid = f => `${CK}/vote/${v.id}/${f}`;
  const official = v.sourceUrl || (v.fileNumber && S.legistar ? S.legistar.url : null);
  const body = C.county.body || "Board of County Commissioners";
  return `<div class="stack-lg view">
    <a class="back" href="${href("votes")}">‹ All ${esc(cname(CK))} commission decisions</a>
    <section class="stack">
      <span class="kicker">${esc(voteDate(v))}${itemRef(v) ? `<span class="sep"></span>${itemRef(v)}` : ""}</span>
      <h1 class="h1">${esc(v.headline)}</h1>
      ${v.inShort ? `<p class="lede">${esc(v.inShort)}</p>` : `<p class="lede">We haven't written a plain-English summary of this one yet. The official wording is at the bottom of this page.</p>`}
    </section>

    <section class="panel stack" aria-labelledby="res">
      <div class="between"><h2 class="h2" id="res">${esc(v.result.value || "Result not confirmed yet")}</h2>${chip(v.result.label, v.result.note)}</div>
      ${glassRoll(v)}
      ${v.motion ? `<p class="small"><b>The motion:</b> ${esc(v.motion)} <span class="muted">A yes vote was a vote for this motion.</span></p>` : ""}
      ${v.minutesText ? (v.minutesText.length > 220 ? `<details class="more small"><summary>What the minutes say</summary><p>"${esc(v.minutesText)}"</p></details>` : `<p class="small"><b>What the minutes say:</b> "${esc(v.minutesText)}"</p>`) : ""}
      ${v.mover && P[v.mover] ? `<p class="small muted">Proposed by ${esc(P[v.mover].name)}${v.seconder && P[v.seconder] ? `, seconded by ${esc(P[v.seconder].name)}` : ""}.</p>` : ""}
      <div class="cite">${chip(v.roll.label, v.roll.note)}${srcLinks(v.roll.sources)}${fixBtn(fid("roll"), v.result.value || "")}</div>
      ${v.roll.label === "conflict" ? factBlock(v.roll, fid("roll")) : ""}
    </section>

    ${impactBlock(v, fid)}

    ${publicBlock(v, fid)}


    ${v.moneyNotes ? `<section class="panel stack" aria-labelledby="mc"><h2 class="h3" id="mc">Campaign money connected to this vote</h2>
      ${v.moneyNotes.map((m, i) => `<div class="stack-sm"><p>${esc(m.text)}</p>${m.note ? `<p class="small muted">${esc(m.note)}</p>` : ""}<div class="cite">${chip(m.label)}${srcLinks(m.sources)}${fixBtn(fid("money-" + i), m.text)}</div></div>`).join("")}
      <p class="small muted">Giving to a campaign is legal and public. This shows a connection, not wrongdoing.</p></section>` : ""}

    ${v.facts.length ? `<section class="stack" aria-labelledby="mean"><h2 class="h2" id="mean">More details</h2>
      <div class="list">${v.facts.map((f, i) => `<div class="li"><span class="body" style="gap:8px"><span>${esc(f.text)}</span><span class="cite">${chip(f.label, f.note)}${srcLinks(f.sources)}${fixBtn(fid("fact-" + i), f.text)}</span></span></div>`).join("")}</div></section>` : ""}

    <section class="stack-sm">
      <div class="cite-box">
        <b>Which vote this is</b>
        <span>${esc(cname(CK))} County ${esc(body)}${v.date ? `, meeting of ${fmtDate(v.date)}` : ""}${v.fileNumber ? `, agenda item ${esc(v.fileNumber)}` : ""}.</span>
        ${official ? `<a href="${esc(official)}" target="_blank" rel="noopener">Open the county's official record of this meeting</a>` : `<span class="small muted">This vote comes from news reports. We haven't matched it to the county's meeting record yet.</span>`}
        <span class="tiny muted">The summary above is our plain-English description. If it doesn't match the official record, the record is what counts. ${fixBtn(fid("summary"), v.inShort || v.headline)}</span>
      </div>
    </section>

    <section class="stack" aria-labelledby="legal">
      <h2 class="h2" id="legal">The official wording</h2>
      ${v.officialTitle ? `<div class="legal">${esc(v.officialTitle)}</div><p class="tiny muted">Copied exactly from the county's agenda${v.fileNumber ? ` for item ${esc(v.fileNumber)}` : ""}.${official ? ` <a href="${esc(official)}" target="_blank" rel="noopener">See it on the county's site</a>.` : ""}</p>` : `<p class="small muted">We don't have the county's official wording for this vote yet.</p>`}
    </section>

    <section class="stack noprint"><h2 class="h3">Sources</h2><div class="cite">${srcLinks(allSources)}</div>
      <div class="row"><button class="btn" type="button" data-share="${v.id}">Make a shareable image</button></div><div id="shareOut" class="stack"></div></section>
    ${others.length ? `<section class="stack noprint"><h2 class="h3">Related decisions</h2><div class="list">${others.map(voteRow).join("")}</div></section>` : ""}
  </div>`;
};

views.votes = () => {
  const t = store.get("gb-topic-" + CK) || "all";
  const list = C.votes.filter(v => t === "all" || v.topic === t);
  const used = C.topics.filter(x => C.votes.some(v => v.topic === x.id));
  return `<div class="stack-lg view">

function citesOf(sid) {
  const out = [];
  C.people.forEach(p => Object.entries(p.facts).forEach(([f, x]) => { const ids = x.sources || (x.versions || []).flatMap(v => v.sources || []); if (ids.includes(sid)) out.push({h: href("p/" + p.id), t: `${p.name}: ${FIELD_NAMES[f] || MONEY_FIELDS[f] || f}`}); }));
  C.votes.forEach(v => { const ids = [...(v.result.sources||[]), ...(v.roll.sources||[]), ...v.facts.flatMap(f => f.sources || [])]; if (ids.includes(sid)) out.push({h: href("v/" + v.id), t: `Vote: ${v.headline}`}); });
  C.races.forEach(r => { if ((r.sources || []).includes(sid)) out.push({h: href("r/" + r.id), t: `Race: ${r.title}`}); });
  return out;
}

views.money = () => policy("How campaign money works", "Who can give to a county commission or school board campaign in Florida, how much, and how to read what we show.", `
  <h2 class="h3">Why it matters</h2>
  <p>County commissioners decide things that are worth a lot of money to some people: what can be built where, which companies get county contracts, what fees and taxes are charged, and how roads, water and trash service are paid for. Many of the businesses and groups affected by those decisions also give to commissioners' campaigns. That is legal and public. Seeing who gives helps you understand whose interests are close to a candidate, and lets you ask good questions. It is not proof that a gift bought a vote.</p>
  <h2 class="h3">The basic rules in Florida</h2>
  <ul class="plain stack-sm">
    <li><b>$1,000 limit.</b> A person, a business or a political committee can give a county or school board candidate up to $1,000 per election.</li>
    <li><b>The primary and general count separately.</b> So a donor can give $1,000 before the August primary and another $1,000 before the November general, unless the candidate is unopposed.</li>
    <li><b>Candidates can spend their own money.</b> There is no limit on what candidates give or lend their own campaigns.</li>
    <li><b>Parties have a bigger limit.</b> A candidate can take up to $50,000 in total from political party committees.</li>
  </ul>
  <p class="small muted">Source: Florida Statutes, <a href="https://www.flsenate.gov/laws/statutes/2022/106.08" target="_blank" rel="noopener">section 106.08</a>.</p>
  <h2 class="h3">Businesses</h2>
  <p>Companies can give to candidates, and each company counts as its own donor. One owner with several companies (often one company per property or project) can give $1,000 from each of them. When we see three or more companies giving from the same street address, we point it out so you can see who is really giving.</p>
  <h2 class="h3">Political committees (PACs)</h2>
  <p>A political committee collects money from people, companies, unions and other committees, then spends it on elections, including gifts to candidates. When a committee gives directly to a candidate, the same $1,000-per-election limit applies.</p>
  <p>Committee names can be vague ("Florida Prosper", "Building Florida's Future"). The name doesn't tell you who funds it. Every Florida committee files reports listing its own donors with the <a href="https://dos.elections.myflorida.com/committees/" target="_blank" rel="noopener">Florida Division of Elections</a>. Where a committee's name plainly says who it represents, such as a realtors' group or a union local, we say so. Otherwise we label it "its name doesn't say who funds it."</p>
  <p>Some groups also spend money on ads that support or attack candidates without giving to the campaign. That spending isn't in the candidate's own reports, so it isn't in our totals yet.</p>
  <h2 class="h3">How we group donors by industry</h2>
  <p>Florida's reports list each donor's name, city and, for many gifts, an occupation or type of business. We group businesses by the line of work they reported, then by words in their name. We group people by the job they reported. For example, a company that lists "Land Development", or whose name includes "Realty", goes under real estate and land development.</p>
  <p>This grouping is ours, not the county's, and some gifts will land in the wrong group. Every group can be opened to see the businesses in it, and every candidate's page links to the full reports. If you spot a mistake, use the report button and we'll fix it.</p>
  <h2 class="h3">Private donors</h2>
  <p>Individual donors' names and addresses are public record, and you can see them in the county's reports. We don't repeat them. We show only the job they reported, so you can see which fields a campaign's money comes from without singling out private people. Businesses, committees and parties are named.</p>
  <h2 class="h3">Where the numbers come from</h2>
  <p>Every candidate files itemized reports with their county Supervisor of Elections. We read those reports every night. Totals include gifts of goods or services (called in-kind), and subtract refunds. Money a candidate lent or gave themselves is shown separately.</p>
`);

views.standards = () => policy("Our standards", "How we decide what goes on this site, and what we do when we get something wrong.", `
  <h2 class="h3">We don't take sides</h2>
  <p>Glass Ballot does not endorse, rate or rank candidates, parties or ballot questions. We list candidates alphabetically. We describe every candidate using the same kinds of facts, and we write about every vote the same way, whoever voted for it.</p>
  <h2 class="h3">Where facts come from</h2>
  <p>We use government records first: meeting minutes and votes, campaign finance reports, election results and official county pages. We also use news reports, nonpartisan research groups and the candidates' own websites, and we label each one so you can tell the difference. Something a candidate says about themselves is shown as their claim, not as a fact.</p>
  <h2 class="h3">How we label facts</h2>
  <ul><li><b>Verified</b> means a government record says it and a second, independent source agrees.</li><li><b>Government record</b> means it comes from a government record we haven't been able to check against a second source.</li><li><b>Not yet confirmed</b> means it comes only from news, research groups or the candidate.</li><li><b>Sources disagree</b> means our sources say different things. We show each version and the government record first.</li><li><b>Not found yet</b> means we looked and couldn't find it.</li></ul>
  <p>Two news outlets owned by the same company count as one source.</p>
  <h2 class="h3">How we write about votes</h2>
  <p>Each vote page has our plain-English summary, the name of the meeting, the agenda item number, a link to the county's official record, the exact motion when the record includes it, and the official wording copied from the county's agenda. If our summary and the record ever differ, the record is right and we will fix the summary.</p>
  <h2 class="h3">Money and connections</h2>
  <p>We show how much each candidate has raised, using the reports they file with their county Supervisor of Elections. When someone who gave money to a commissioner later had business before the commission, we list that connection, with the dates. A donation is legal and public. Listing a connection does not mean anyone did anything wrong, and we never say or suggest that it does.</p>
  <h2 class="h3">The Pocket or Public score</h2>
  <p>This is a measure we're building to show, from public records only, how often an official's votes may have benefited themselves or their donors rather than the public. It never uses party or our opinion of whether a vote was good. Its parts are conflicts of interest, money and timing, promises kept, and showing up. We only show an overall score once we have enough data, and how it's calculated is explained on our standards page.</p>
  <h2 class="h3">Corrections</h2>
  <p>Anyone can report a mistake using the pencil button next to any fact. We need a link to a record or published report so we can check it. A person reviews every report. If we change a fact, we list the date, what it said before and what it says now on our <a href="#/corrections">changes and corrections page</a>. We do not quietly edit facts. Candidates and officials can use the same form, or email us at glassballotinfo@gmail.com.</p>
  <h2 class="h3">Independence</h2>
  <p>Glass Ballot is free to use. We do not accept money from candidates, campaigns, political parties, political committees or anyone appearing on the ballot, and we do not run political ads. If we ever accept funding from anyone else, we will list it on this page.</p>
  <h2 class="h3">Automation</h2>
  <p>Software collects public records each night and updates numbers like vote counts and campaign totals. Software also helps us find and organize records. A person writes and reviews every plain-English summary before it appears as a summary. When something is waiting for review, the page says so.</p>`);

async function makeShare(id) {
  const v = V[id]; const out = $("#shareOut");
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1080; const x = c.getContext("2d");
  await document.fonts.ready.catch(() => {});
  const H = '"Plus Jakarta Sans", system-ui, sans-serif', B = 'Inter, system-ui, sans-serif';
  const g = x.createLinearGradient(0,0,1080,1080); g.addColorStop(0,"#0B3D91"); g.addColorStop(1,"#1A56D0"); x.fillStyle = g; x.fillRect(0,0,1080,1080);
  x.fillStyle = "#FFFFFF"; x.font = `800 46px ${H}`; x.fillText("Glass", 72, 120); const gw = x.measureText("Glass").width; x.fillStyle = "#8DB8FF"; x.fillText("Ballot", 72 + gw + 6, 120);
  x.fillStyle = "#A9C8FF"; x.font = `600 28px ${B}`; x.fillText(`${C.county.name} Commission, ${voteDate(v)}${v.fileNumber ? ", item " + v.fileNumber : ""}`, 72, 230);
  x.fillStyle = "#FFFFFF"; x.font = `800 66px ${H}`;
  const lines = wrapText(x, v.headline, 936).slice(0,4); lines.forEach((l,i) => x.fillText(l, 72, 330 + i*78));
  let y = 330 + lines.length*78 + 44;
  x.fillStyle = "#5EEAD4"; x.font = `800 50px ${H}`; x.fillText(v.result.value || "Result not confirmed", 72, y);
  const r = rollOf(v); y += 70;
  if (r && (r.yes?.length || r.no?.length)) { x.fillStyle = "#E8F6FF"; x.font = `500 32px ${B}`;
    wrapText(x, `Yes: ${(r.yes||[]).map(i => P[i] ? lastName(P[i]) : i).join(", ")}`, 936).forEach(l => { x.fillText(l, 72, y); y += 44; });
    wrapText(x, `No: ${(r.no||[]).map(i => P[i] ? lastName(P[i]) : i).join(", ") || "none"}`, 936).forEach(l => { x.fillText(l, 72, y); y += 44; }); }
  x.fillStyle = "#A9C8FF"; x.font = `600 28px ${B}`; x.fillText("Official record linked at glassballot.org", 72, y + 20);
  x.fillStyle = "#FFFFFF"; x.font = `800 40px ${H}`; x.fillText("glassballot.org", 72, 1010);
  c.toBlob(blob => { const url = URL.createObjectURL(blob);
    out.innerHTML = `<img src="${url}" alt="Shareable image: ${esc(v.headline)}" style="border-radius:14px;border:1px solid var(--line);max-width:420px"><a class="btn" href="${url}" download="glassballot-${esc(id)}.png">Save image</a>`; }, "image/png");
}

/* ---------- corrections form ---------- */
const fixDlg = $("#fixDlg");
function openFix(btn) {
  const sent = Number(store.get("gb-fix-count") || 0);
  if (sent >= 5) { $("#fixQuote").textContent = "You've already sent several reports. Thank you. To send more, please email glassballotinfo@gmail.com with your links."; $("#fixForm").hidden = true; fixDlg.showModal(); return; }
  $("#fixForm").hidden = false; $("#fxMsg").textContent = "";
  $("#fxCounty").value = CK || ""; $("#fxPage").value = location.hash; $("#fxFact").value = btn.dataset.fix; $("#fxShown").value = btn.dataset.shown; $("#fxOpened").value = String(Date.now());
  $("#fixQuote").innerHTML = `<span class="tiny muted">You're reporting a problem with:</span><div style="font-weight:600">${esc(btn.dataset.shown || "This page")}</div>`;
  fixDlg.showModal();
}
$("#fixForm").addEventListener("submit", e => {
  const f = e.target, msg = $("#fxMsg");
  if (f.website.value) { e.preventDefault(); return; }
  if (Date.now() - Number($("#fxOpened").value || 0) < 4000) { e.preventDefault(); msg.textContent = "Please take a moment to check your link, then send."; return; }
  if (!/^https?:\/\/[^\s/]+\.[^\s]+$/.test(f.evidence.value.trim())) { e.preventDefault(); msg.textContent = "Please add a full link, starting with https://"; return; }
  if ((f.suggestion.value.match(/https?:\/\//g) || []).length > 2) { e.preventDefault(); msg.textContent = "Please put your link in the link box."; return; }
  store.set("gb-fix-count", String(Number(store.get("gb-fix-count") || 0) + 1));
});

/* ---------- ZIP lookup ---------- */
function zipLookup(z) {
  const msg = $("#zipMsg"); const hit = (DATA.zips || {})[z];
  const nm = k => COUNTIES[k] ? cname(k) : (DATA.map.c[k]?.name || k);
  if (!/^\d{5}$/.test(z)) { msg.textContent = "Please type a 5-digit ZIP code."; return; }
  if (!hit) { msg.textContent = "That doesn't look like a Florida ZIP code. Glass Ballot covers Florida counties."; return; }
  const ours = hit.filter(k => COUNTIES[k]), soon = hit.filter(k => !COUNTIES[k]);
  if (ours.length === 1 && !soon.length) { location.hash = "#/" + ours[0]; return; }
  if (!ours.length) { msg.innerHTML = `ZIP ${esc(z)} is in ${soon.map(k => esc(nm(k)) + " County").join(" and ")}. We don't cover ${soon.length > 1 ? "those counties" : "that county"} yet, but we're adding every Florida county. Right now we cover ${ORDER.map(k => `<a href="#/${k}">${esc(cname(k))}</a>`).join(", ")}.`; return; }
  msg.innerHTML = `ZIP ${esc(z)} crosses county lines. Which county do you live in? ${ours.map(k => `<a href="#/${k}">${esc(cname(k))}</a>`).join(" or ")}${soon.length ? ` (or ${soon.map(k => esc(nm(k))).join(", ")}, which we don't cover yet)` : ""}`;
}

/* ---------- search ---------- */
function searchIndex() { const out = [];
  ORDER.forEach(k => { const c = COUNTIES[k], n = cname(k);
    if (c.stub) { c.index.forEach(([h, t, s]) => out.push({h, t, s})); return; }
    c.people.forEach(p => out.push({h:`#/${k}/p/${p.id}`, t:p.name, s:`${p.office}${p.district ? ", District " + p.district : ""} · ${n}`}));
    c.votes.forEach(v => out.push({h:`#/${k}/v/${v.id}`, t:v.headline, s:`${voteDate(v)} · ${n}`}));
    c.races.forEach(r => out.push({h:`#/${k}/r/${r.id}`, t:r.title, s:`${n} County ballot`}));
    c.topics.forEach(t => out.push({h:`#/${k}/t/${t.id}`, t:t.name, s:`Topic · ${n}`})); });
  out.push({h:"#/about", t:"About Glass Ballot", s:"Who we are"}, {h:"#/standards", t:"Our standards", s:"How we work"});
  return out; }
function runSearch(q) { const ql = q.trim().toLowerCase(); const items = searchIndex().filter(i => !ql || (i.t + " " + i.s).toLowerCase().includes(ql)).slice(0, 14);
  $("#results").innerHTML = items.length ? items.map(i => `<a href="${i.h}"><span><b>${esc(i.t)}</b></span><span class="small muted" style="text-align:right">${esc(i.s)}</span></a>`).join("") : `<p class="muted">Nothing matches "${esc(q)}". Try a last name or a word like taxes.</p>`; }

/* ---------- router ---------- */
function notFound() { return `<div class="stack view"><h1 class="h1">We couldn't find that page</h1><p><a href="#/">Go to the start</a></p></div>`; }
const GLOBAL = {money:"about", about:"about", standards:"about", terms:"about", privacy:"about", accessibility:"about", corrections:"about", sources:"about", thanks:""};
function route() {
  if (location.pathname === "/thanks") { history.replaceState(null, "", "/#/thanks"); }
  let h = (location.hash || "#/").slice(1);
  const old = h.match(/^(p|v|r|t)-(.+)$/); if (old) { location.replace(`#/pinellas/${old[1]}/${old[2]}`); return; }
  if (["ballot","officials","votes","topics","problems"].includes(h)) { location.replace(`#/pinellas${h === "ballot" ? "" : "/" + h}`); return; }
  if (h === "how" || h === "/how") { location.replace("#/standards"); return; }
  const parts = h.replace(/^\//, "").split("/").filter(Boolean);
  let html, tab = "ballot";
  if (!parts.length) { CK = null; html = views.home(); tab = "home"; }
  else if (parts[0] in GLOBAL) { if (parts[0] === "sources") CK = null; html = views[parts[0]](); tab = GLOBAL[parts[0]]; }
  else if (useCounty(parts[0]) === "load") {
    $("#app").innerHTML = `<div class="stack view"><p class="muted">Loading ${esc(COUNTIES[parts[0]].county.name)}…</p></div>`;
    loadCounty(parts[0]).then(route).catch(() => { $("#app").innerHTML = `<div class="stack view"><h1 class="h1">We couldn't load this county</h1><p>Check your connection and <a href="${esc(location.hash)}" onclick="location.reload()">try again</a>.</p></div>`; });
    return;
  }
  else if (useCounty(parts[0])) {
    const [, a, b] = parts;
    if (!a) html = views.ballot();
    else if (a === "officials") { html = views.officials(); tab = "officials"; }
    else if (a === "votes") { html = views.votes(); tab = "officials"; }
    else if (a === "vote") { html = views.vote(); tab = "vote"; }
    else if (a === "mylist") html = views.mylist();
    else if (a === "problems") { html = views.problems(); tab = "about"; }
    else if (a === "sources") { html = views.sources(); tab = "about"; }
    else if (a === "p") { html = views.person(b); tab = P[b] && P[b].race ? "ballot" : "officials"; }
    else if (a === "v") { html = views.vote_item(b); tab = "officials"; }
    else if (a === "r") html = views.race(b);
    else if (a === "t") { html = views.topic(b); tab = "officials"; }
    else if (a === "s") { html = views.source(b); tab = "about"; }
    else html = notFound();
  } else html = notFound();
  $("#app").innerHTML = html;
  const ck = CK || store.get("gb-county");
  $("#countyName").textContent = CK ? cname(CK) : (ck && COUNTIES[ck] ? cname(ck) : "County");
  document.querySelectorAll("[data-tab]").forEach(a => {
    const t = a.dataset.tab;
    if (t === "ballot") a.href = ck ? `#/${ck}` : "#/"; else if (t === "officials") a.href = ck ? `#/${ck}/officials` : "#/"; else if (t === "vote") a.href = ck ? `#/${ck}/vote` : "#/";
    if (t === tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  document.title = CK ? `${cname(CK)} County ballot guide | Glass Ballot` : "Glass Ballot | Florida local election guide";
  $("#search").hidden = true;
  window.scrollTo(0, 0);
}

function countyChoices() { $("#countyChoices").innerHTML = ORDER.map(k => `<a href="#/${k}" data-close><span class="body"><span class="title">${esc(COUNTIES[k].county.name)}</span><span class="tiny muted">${nRaces(k)} races on the Nov 3 ballot</span></span>${chev}</a>`).join("") + `<a href="#/" data-close><span class="body"><span class="title">Start over</span><span class="tiny muted">Look up by ZIP code</span></span>${chev}</a>`; }

function setBig(on) { document.documentElement.classList.toggle("big", on); $("#textSize").setAttribute("aria-pressed", String(on)); $("#textSize").setAttribute("aria-label", on ? "Make text smaller" : "Make text bigger"); store.set("gb-big", on ? "1" : ""); }
setBig(store.get("gb-big") === "1");

document.addEventListener("click", e => {
  const cl = e.target.closest("[data-close]"); if (cl) { cl.closest("dialog")?.close(); if (cl.tagName !== "A") return; }
  const fx = e.target.closest("[data-fix]"); if (fx) { openFix(fx); return; }
  const pk = e.target.closest("[data-pick]"); if (pk) { const [race, pid] = pk.dataset.pick.split("|"); setPick(CK, race, pid); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
  const mo = e.target.closest("[data-more]"); if (mo) { showAll.add(mo.dataset.more); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
  const d = e.target.closest("[data-district]"); if (d) { store.set("gb-district-" + CK, d.dataset.district); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
  const t = e.target.closest("[data-topic]"); if (t) { store.set("gb-topic-" + CK, t.dataset.topic); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
  const s = e.target.closest("[data-share]"); if (s) { makeShare(s.dataset.share); return; }
  if (e.target.closest("#textSize")) { setBig(!document.documentElement.classList.contains("big")); return; }
  if (e.target.closest("#pickCounty")) { countyChoices(); $("#countyDlg").showModal(); return; }
  if (e.target.closest("#openSearch")) { $("#search").hidden = false; $("#q").value = ""; runSearch(""); $("#q").focus(); return; }
  if (e.target.closest("#closeSearch")) { $("#search").hidden = true; return; }
  const jump = e.target.closest("[data-jump]"); if (jump) { e.preventDefault(); const el = document.getElementById(jump.dataset.jump); if (el) { if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView({behavior: "smooth", block: "start"}); } return; }
  const link = e.target.closest('a[href^="#"]'); if (link && link.getAttribute("href") === location.hash) { route(); }
});
document.addEventListener("submit", e => { if (e.target.id === "zipForm") { e.preventDefault(); zipLookup($("#zipIn").value.trim()); } });
document.querySelectorAll("dialog").forEach(dl => dl.addEventListener("click", e => { if (e.target === dl) dl.close(); }));
$("#q").addEventListener("input", e => runSearch(e.target.value));
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#search").hidden) $("#search").hidden = true; });
window.addEventListener("hashchange", route);

$("#foot").innerHTML = `<div class="wrap stack" style="gap:14px">
  <span class="wordmark">Glass<b>Ballot</b><i>.org</i></span>
  <p style="max-width:62ch">A free, independent guide to Florida's local elections. We don't endorse candidates or take money from campaigns. Information comes from public records and published reports and was last updated ${fmtDate(DATA.region.updated)}. Photos at the top of pages are illustrations.</p>
  <p class="row" style="gap:6px 18px"><a href="#/about">About</a><a href="#/standards">Our standards</a><a href="#/sources">Sources</a><a href="#/corrections">Corrections</a><a href="#/terms">Terms</a><a href="#/privacy">Privacy</a><a href="#/accessibility">Accessibility</a><a href="mailto:glassballotinfo@gmail.com">Contact</a></p>
</div>`;
route();
</script>
